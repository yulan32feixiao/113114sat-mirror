];

function buildMessages(q, a, askText, history){
  const sys = aiSystem(q);
  const facts = serializeQuestion(q, a);
  const frame = frameFor(q);
  const hist  = relatedMistakes(q);
  const turns = [{role:"system", content: sys}];
  let head = `${facts}\n\n【本题分析框架】\n${frame}`;
  if(hist) head += `\n\n${hist}`;
  turns.push({role:"user", content: head + `\n\n【我的问题】\n${askText}`});
  // 对话不长，最多带最近 3 轮
  (history||[]).slice(-6).forEach(m=>turns.push(m));
  return turns;
}

/* ============ 拆解 ============ */
const stripTags = h => {
  const d = document.createElement("div");
  d.innerHTML = String(h||"");
  d.querySelectorAll("math").forEach(m=>{
    const alt = m.getAttribute("alttext");
    m.replaceWith(document.createTextNode(alt? " "+alt+" " : " [公式] "));
  });
  d.querySelectorAll("svg,figure,img").forEach(f=>{
    const alt = f.getAttribute && (f.getAttribute("aria-label")||f.getAttribute("alt"));
    f.replaceWith(document.createTextNode(alt? " [图："+alt+"] " : " [图形] "));
  });
  return d.textContent.replace(/\s+/g," ").trim();
};

function questionAsText(q, st){
  const L = ["ABCD"];
  let s = `【考点】${DOMAINS[q.dom].name} → ${q.sk}｜难度 ${DIFF[q.df]||q.df}｜官方 score band ${q.bd}\n`;
  if(q.sti) s += `【材料】${stripTags(q.sti)}\n`;
  s += `【问题】${stripTags(q.ste)}\n`;
  if(q.ty==="spr") s += `【题型】填空题\n`;
  else q.op.forEach((o,k)=>{ s += `${"ABCD"[k]}. ${stripTags(o)}\n`; });
  s += `【正确答案】${q.an.join(" / ")}\n`;
  if(st){
    s += `【我的作答】${st.picked}${st.ok?"（对）":"（错）"}\n`;
    if(st.ms) s += `【用时】${Math.round(st.ms/1000)} 秒\n`;
  }
  s += `【College Board 官方解析】${stripTags(q.ra)}\n`;
  return s.slice(0, 24000);
}

`你在帮一名中国学生备考数字 SAT。他托福 100，目标 12 月考到 1550（R&W 750 / Math 780）。

用中文回答，控制在 350 字以内，严格按这四段写，每段用「■ 标题」开头：
■ 这道题考什么 — 用一句话点破这道题真正测的那项能力（不是复述题干）。
■ 命题人怎么设的坑 — 错误选项是按什么思路造出来的，为什么看着对。特别针对他实际选的那个选项。
■ 你缺的那块 — 从他选的那个错误选项和用时判断，缺的是知识点、阅读精度，还是推理链条。说具体：缺哪条语法规则、哪个数学概念、哪种证据匹配方式。如果他做对了，就说这道题他掌握到了什么程度、还有没有侥幸成分。
■ 补什么 — 一句话说清要补的那个知识点本身（把规则/概念直接讲出来，不要只说"去复习 X"）。

不要写开场白和结束语，不要用 markdown 星号加粗。`;

function renderNote(holder, q, text, st){
  holder.innerHTML = "";

/* 讲解反馈 —— 记下来，并拼进以后每一次讲题请求 */
function feedbackRow(q){
  const row = el("div","fbrow");
  const done = (settings.fb||[]).find(f=>f.qid===q.id);
  if(done){
    row.innerHTML = `<span class="fbdone">已反馈：${esc(done.tag)}${done.text? " · "+esc(done.text):""}</span>`;
    const undo = el("button","drillbtn","撤回");
    undo.onclick=()=>{ settings.fb = settings.fb.filter(f=>f.qid!==q.id); saveSettings();
                       row.replaceWith(feedbackRow(q)); };
    row.appendChild(undo);
    return row;
  }
  row.appendChild(el("span","fblbl","这个讲解怎么样？"));
  const add = (tag, needText)=>{
    const b = el("button","fbchip", tag);
    b.onclick = ()=>{
      if(!needText){ pushFb(q.id, tag, ""); row.replaceWith(feedbackRow(q)); return; }
      row.innerHTML = "";
      row.appendChild(el("span","fblbl", tag+" —"));
      const inp = el("input"); inp.type="text"; inp.className="fbinput";
      inp.placeholder = "具体想怎么改？比如「别复述题干，直接说规则」";
      const ok = el("button","drillbtn","提交");
      const send = ()=>{ pushFb(q.id, tag, inp.value.trim()); row.replaceWith(feedbackRow(q));
                         toast("记下了，以后的讲解会照着改"); };
      ok.onclick = send;
      inp.onkeydown = e=>{ if(e.key==="Enter") send(); };
      row.appendChild(inp); row.appendChild(ok);
      inp.focus();
    };
    row.appendChild(b);
  };
  add("有用", false);
  add("没说到点上", true);
  add("太啰嗦", true);
  return row;
}
function pushFb(qid, tag, text){
  settings.fb = (settings.fb||[]).filter(f=>f.qid!==qid);
  settings.fb.push({qid, tag, text, ts:Date.now()});
  settings.fb = settings.fb.slice(-40);
  saveSettings();
}

async function explainOne(holder, q, st, btn, force){
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spin"></span>正在拆解…'; }
  holder.innerHTML = "";
  const box = el("div","explain");

  const body = el("div","body"); box.appendChild(body); holder.appendChild(box);
  try{
    const text = await dsChat(TUTOR_RULES + prefBlock() + "\n\n---\n\n" + questionAsText(q, st),
      {onText: t=>{ body.textContent = t; }});
    await saveNote(q.id, text);

}

/* ============ 模考评分 ============
   换算表逐行取自 College Board 官方
   SAT Practice Test #11 Scoring Guide（scoring-sat-practice-test-11-digital.pdf）
   的 Raw Score Conversion Table。官方给的是区间（lower/upper）。

   ⚠ 这张表是给纸质线性版用的：R&W 66 题、Math 54 题。
   本工具的模考是 R&W 54 题、Math 44 题（与真考题数一致）。
   所以先把原始分按题数等比折算到 66 / 54，再查表。
   这一步是本工具的近似，不是 College Board 的算法 —— 真考用的是 IRT，换算表从未公开。 */
const CONV_RW = [[200,200],[210,220],[210,220],[210,220],[210,220],[210,230],[220,240],[220,240],
[220,250],[230,260],[230,270],[240,280],[250,290],[250,300],[260,310],[270,320],[270,330],[290,330],
[300,340],[310,350],[320,360],[330,370],[340,380],[340,380],[350,390],[360,400],[360,400],[370,410],
[380,420],[390,430],[390,430],[400,440],[410,450],[420,460],[430,470],[440,480],[450,490],[450,490],
[460,500],[470,510],[470,530],[480,540],[490,550],[500,560],[510,570],[520,580],[530,590],[540,600],
[560,620],[570,630],[580,640],[590,650],[600,660],[620,680],[630,690],[640,700],[660,700],[680,720],
[690,730],[700,740],[710,750],[720,760],[730,770],[740,780],[760,780],[780,800],[800,800]];
const CONV_MATH = [[200,200],[210,220],[210,220],[210,230],[220,240],[230,250],[240,270],[250,290],
[260,320],[270,330],[290,350],[310,350],[330,370],[340,380],[350,390],[350,390],[360,400],[370,410],
[370,410],[380,420],[390,430],[390,430],[400,440],[410,450],[410,450],[420,460],[430,470],[440,480],
[450,490],[460,500],[470,510],[480,520],[490,530],[490,550],[500,560],[510,570],[530,590],[540,600],
[550,610],[560,620],[570,630],[590,650],[600,660],[610,670],[620,680],[640,700],[650,710],[660,720],
[680,740],[700,760],[710,770],[730,780],[750,800],[770,800],[790,800]];
const PAPER_MAX = {1:66, 2:54};      // 官方评分表对应的题数
const MOCK_MAX  = {1:54, 2:44};      // 本工具模考（与真考一致）

function scaledScore(sec, raw, total){
  const tbl = sec===1 ? CONV_RW : CONV_MATH;
  const src = total || MOCK_MAX[sec];
  const eq = Math.max(0, Math.min(PAPER_MAX[sec], Math.round(raw / src * PAPER_MAX[sec])));
  const [lo,hi] = tbl[eq];
  return {lo, hi, eq, paperMax:PAPER_MAX[sec]};
}

/* ============ 模考报告 ============
   这里刻意不给一个精确分数。College Board 的自适应算分基于 IRT，换算表从未公开，
   任何第三方"换算"都是猜的。下面给的是原始对错 + 分数段证据 + 一个标明规则的估算区间。 */
function bandEstimate(rows){
  // 规则：按 band 从高到低找，第一个「做了 ≥4 题且正确率 ≥60%」的 band 即估算落点。
  const by = {};
  rows.forEach(r=>{ const b=r.bd||0; (by[b]=by[b]||{n:0,ok:0}); by[b].n++; if(r.ok) by[b].ok++; });
  let hit = null;
  for(let b=7;b>=1;b--){
    const s = by[b];
    if(s && s.n>=4 && s.ok/s.n >= 0.6){ hit = b; break; }
  }
  return {by, band:hit};
}

     但那张表是给<b>纸质线性版</b>用的（R&W 66 题、Math 54 题），而本工具的模考是 R&W 54 题、Math 44 题
     （与真考题数一致）。我先把原始分<b>按题数等比折算</b>到 66 / 54 再查表——
     <b>这步折算是本工具的近似，不是 College Board 的算法</b>。真考用 IRT 模型、换算表从未公开，
     市面上任何「数字 SAT 换算表」都是猜的。<br>
     所以：<b>原始分实打实，区间是估的。</b>要准确分数只能做 Bluebook 官方模考。<br><br>
     下面每个 section 的 band 估算是另一套参考口径：按官方 score band 从高到低找，第一个「做够 4 题且
     正确率 ≥60%」的 band 即落点，band 对应分数取自 Skills Insight（2026 年 7 月版 Table 3）。这个规则也是本工具定的。</p>`));

  // 分考点
  const byS = {};
  allRows.forEach(r=>{ const k=r.dom+"|"+r.sk; (byS[k]=byS[k]||{dom:r.dom,sk:r.sk,n:0,ok:0}); byS[k].n++; if(r.ok) byS[k].ok++; });
  const list = Object.values(byS).sort((a,b)=> (a.ok/a.n)-(b.ok/b.n));
  const tw = el("div","tablewrap"); tw.style.marginBottom="18px";
  const t = el("table","skills");
  t.innerHTML = `<thead><tr><th>考点</th><th class="r">对/做</th><th class="r" style="width:150px">正确率</th></tr></thead>`;
  const tb = el("tbody");
  list.forEach(x=>{
    const acc = Math.round(x.ok/x.n*100);
    const tr = el("tr","skillrow");
    tr.innerHTML = `<td><div class="skname">${esc(x.sk)}</div>
        <div class="skmeta">${esc(DOMAINS[x.dom].name)}</div></td>
      <td class="r skmeta">${x.ok} / ${x.n}</td>
      <td class="r"><div class="acc"><div class="accbar">
        <i class="${acc>=85?"good":(acc<65?"warn":"")}" style="width:${acc}%"></i></div>
        <span class="accnum">${acc}%</span></div></td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t);
  wrap.appendChild(el("div","blockhead",'<h2>分考点表现</h2><span class="note">按正确率从低到高</span>'));
  wrap.appendChild(tw);

  const row = el("div","btnrow");
  const wrongQs = allRows.filter(r=>!r.ok).map(r=>r.q);
  if(wrongQs.length){
    const rv = el("button","ghost",`订正这 ${wrongQs.length} 道错题`);
    rv.onclick=()=>{ mockPlan=null; run=null; startRun(wrongQs,{label:"模考订正",timed:false}); };
    row.appendChild(rv);
  }
  const dlb = el("button","ghost","导出 Word");
  dlb.onclick=()=>exportDocx(dlb, allRows.map(r=>({q:r.q, st:r.s})),
    {title:"SAT 模考报告", n:allRows.length, ok:allRows.filter(r=>r.ok).length,
     secs:Math.round(activeMs/1000), label:"模考"}, "");
  row.appendChild(dlb);
  const back = el("button","primary","回控制台");
  back.onclick=()=>{ mockPlan=null; closeRun(); };
  row.appendChild(back);
  wrap.appendChild(row);

  pane.appendChild(wrap); body.appendChild(pane); root.appendChild(body);
}

/* ============ Word 导出 ============ */
const xe = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
                             .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
const BLOCK_TAGS = /^(p|li|div|table|ul|ol|tbody|thead|tr|blockquote)$/;
const EMU = 9525;                 // 1 px
const MAX_W = 5486400;            // 正文可用宽度约 6 英寸

/* 把题目里的内嵌 SVG 光栅化成 PNG —— Word 不认 SVG 和 MathML */
async function rasterizeSvg(svgEl, scale){
  scale = scale || 2;
  const probe = document.createElement("canvas");
  if(!probe.getContext || !probe.getContext("2d") || !probe.toBlob)
    throw new Error("这个浏览器不支持 canvas 导出");
  const clone = svgEl.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  let w = parseFloat(clone.getAttribute("width"));
  let h = parseFloat(clone.getAttribute("height"));
  if(!w || !h){
    const vb = (clone.getAttribute("viewBox")||"").split(/[\s,]+/).map(Number);
    if(vb.length===4){ w = w || vb[2]; h = h || vb[3]; }
  }
  w = w || 400; h = h || 300;
  clone.setAttribute("width", w); clone.setAttribute("height", h);
  const xml = new XMLSerializer().serializeToString(clone);
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  const img = new Image();
  await new Promise((res,rej)=>{
    img.onload=res; img.onerror=()=>rej(new Error("SVG 渲染失败"));
    img.src=url;
    setTimeout(()=>rej(new Error("SVG 渲染超时")), 8000);
  });
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(w*scale));
  cv.height = Math.max(1, Math.round(h*scale));
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);   // 线条是黑的，必须垫白底
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r=>cv.toBlob(r, "image/png"));
  if(!blob) throw new Error("canvas 导出失败");
  return {blob, w, h};
}

/* 预处理：把 HTML 里的 svg 换成 <img data-media="N">，同时收集 PNG */
async function collectMedia(html, media){
  if(!html || html.indexOf("<svg")<0) return html;
  const root = document.createElement("div");
  root.innerHTML = html;
  const svgs = Array.from(root.querySelectorAll("svg"));
  for(const sv of svgs){
    try{
      const {blob, w, h} = await rasterizeSvg(sv);
      const idx = media.length;
      media.push({name:`image${idx+1}.png`, blob, w, h});
      const ph = document.createElement("img");
      ph.setAttribute("data-media", String(idx));
      (sv.closest("figure") || sv).replaceWith(ph);
    }catch(e){
      // 转不成图就退回官方给的文字描述 —— 至少信息不丢
      const d = (sv.getAttribute("aria-label")||"").replace(/\s+/g," ").trim();
      media.failed = (media.failed||0) + 1;
      media.failReason = media.failReason || (e && e.message) || "unknown";
      (sv.closest("figure") || sv).replaceWith(document.createTextNode(
        d ? `\n［图（未能转成图片，以下为官方文字描述）：${d}］\n`
          : "\n［此处有一张图，未能转成图片，官方也没有提供文字描述］\n"));
    }
  }
  return root.innerHTML;
}

function normalizeMathFigs(root){
  root.querySelectorAll(".sr-only").forEach(e=>e.remove());   // 屏幕阅读器专用文本不进 Word
  root.querySelectorAll("math").forEach(m=>{
    const a = m.getAttribute("alttext");
    m.replaceWith(document.createTextNode(a? " "+a+" " : " [公式] "));
  });
  root.querySelectorAll("img").forEach(f=>{
    if(f.hasAttribute("data-media")) return;          // 我们自己放的图片占位，留着
    const a = f.getAttribute("alt");
    f.replaceWith(document.createTextNode(a? " [图："+a+"] " : " [图形] "));
  });
  root.querySelectorAll("svg,figure").forEach(f=>{
    if(f.querySelector && f.querySelector("img[data-media]")) return;
    if(!f.parentNode) return;
    const a = f.getAttribute && f.getAttribute("aria-label");
    f.replaceWith(document.createTextNode(a? " [图："+a+"] " : " [图形，见原题] "));
  });
}

function htmlToBlocks(html){
  const root = document.createElement("div");
  root.innerHTML = String(html||"");
  normalizeMathFigs(root);
  const out = [];
  const txt = e => e.textContent.replace(/\s+/g," ").trim();
  const hasBlockChild = e => [...e.children].some(ch=>BLOCK_TAGS.test(ch.tagName.toLowerCase()));
  (function walk(n){
    for(const c of n.childNodes){
      if(c.nodeType===3){ const t=c.textContent.replace(/\s+/g," ").trim(); if(t) out.push({type:"p",text:t}); }
      else if(c.nodeType===1){
        const tag = c.tagName.toLowerCase();
        if(tag==="img" && c.hasAttribute("data-media")){
          out.push({type:"image", idx:+c.getAttribute("data-media")});
        }else if(tag==="table"){
          const rows = [...c.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>txt(td)));
          if(rows.length) out.push({type:"table", rows});
        }else if(c.querySelector && c.querySelector("img[data-media],table")) walk(c);
        else if(hasBlockChild(c)) walk(c);
        else { const t=txt(c); if(t) out.push({type:"p", text:(tag==="li"?"· ":"")+t}); }
      }
    }
  })(root);
  if(!out.length){ const t=txt(root); if(t) out.push({type:"p",text:t}); }
  return out;
}

function wP(text, o){
  o = o||{};
  // CT_RPr / CT_PPr 的子元素顺序是 schema 强制的，写反 Word 会拒绝打开。
  // rPr: b, i, color, sz, szCs   —   pPr: shd, spacing, ind, outlineLvl
  const rpr = `<w:rPr>${o.bold?"<w:b/>":""}${o.italic?"<w:i/>":""}`
    + (o.color?`<w:color w:val="${o.color}"/>`:"")
    + `<w:sz w:val="${o.size||22}"/><w:szCs w:val="${o.size||22}"/></w:rPr>`;
  const ppr = `<w:pPr>`
    + (o.shade?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`:"")
    + `<w:spacing w:before="${o.before??40}" w:after="${o.after??40}" w:line="276" w:lineRule="auto"/>`
    + (o.ind?`<w:ind w:left="${o.ind}"/>`:"")
    + (o.outline!=null?`<w:outlineLvl w:val="${o.outline}"/>`:"")
    + `</w:pPr>`;
  const parts = String(text??"").split("\n");
  const runs = parts.map((t,i)=>
    (i?`<w:r>${rpr}<w:br/></w:r>`:"")+`<w:r>${rpr}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`).join("");
  return `<w:p>${ppr}${runs}</w:p>`;
}
function wImage(m, n){
  let cx = Math.round(m.w * EMU), cy = Math.round(m.h * EMU);
  if(cx > MAX_W){ cy = Math.round(cy * MAX_W / cx); cx = MAX_W; }
  const rid = "rIdImg" + n;
  return `<w:p><w:pPr><w:spacing w:before="120" w:after="120"/></w:pPr><w:r><w:drawing>`
    + `<wp:inline distT="0" distB="0" distL="0" distR="0">`
    + `<wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n+1}" name="Figure ${n+1}"/>`
    + `<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">`
    + `<pic:pic><pic:nvPicPr><pic:cNvPr id="${n+1}" name="Figure ${n+1}"/><pic:cNvPicPr/></pic:nvPicPr>`
    + `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
    + `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>`
    + `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>`
    + `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}
function wRule(){
  return `<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="C8CCC2"/></w:pBdr>`
    + `<w:spacing w:before="160" w:after="120"/></w:pPr></w:p>`;
}
function wTable(rows){
  const border = v=>`<w:${v} w:val="single" w:sz="4" w:space="0" w:color="B9BEB2"/>`;
  const tblPr = `<w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>`
    + ["top","left","bottom","right","insideH","insideV"].map(border).join("")
    + `</w:tblBorders></w:tblPr>`;
  const body = rows.map((r,ri)=>`<w:tr>`+ r.map(cell=>
      `<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>${ri===0?'<w:shd w:val="clear" w:color="auto" w:fill="EEF0EA"/>':""}</w:tcPr>`
      + wP(cell,{size:19, bold:ri===0, before:20, after:20}) + `</w:tc>`).join("") + `</w:tr>`).join("");
  return `<w:tbl>${tblPr}${body}</w:tbl>` + wP("", {before:0, after:0, size:2});
}
function blocksToXml(blocks, opt){
  opt = opt||{};
  let first = true;
  return blocks.map(b=>{
    if(b.type==="table") return wTable(b.rows);
    if(b.type==="image") return wImage(opt.media[b.idx], b.idx);
    const text = (first && opt.prefix ? opt.prefix : "") + b.text;
    first = false;
    return wP(text, opt);
  }).join("");
}

async function buildDocx(bodyXml, media){
  if(typeof JSZip==="undefined") throw new Error("JSZip 未加载");
  const zip = new JSZip();
  const imgRels = media.map((m,i)=>
    `<Relationship Id="rIdImg${i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join("");
  zip.file("[Content_Types].xml",
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Default Extension="png" ContentType="image/png"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`);
  zip.folder("_rels").file(".rels",
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);
  const w = zip.folder("word");
  w.folder("_rels").file("document.xml.rels",
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
${imgRels}
</Relationships>`);
  if(media.length){
    const mf = w.folder("media");
    media.forEach(m=> mf.file(m.name, m.blob));
  }
  w.file("styles.xml",
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr>
<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Microsoft YaHei" w:cs="Calibri"/>
<w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
</w:styles>`);
  w.file("document.xml",
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
 xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
 xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
 xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>
${bodyXml}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1021" w:bottom="1134" w:left="1021" w:header="709" w:footer="709"/></w:sectPr>
</w:body></w:document>`);
  return zip.generateAsync({type:"blob", compression:"DEFLATE"});
}

async function questionXml(q, a, idx, note, media){
  let x = "";
  const markTag = marks[q.id] ? "【已标记】" : "";
  x += wP(`${idx}. ${markTag}${DOMAINS[q.dom].name} → ${q.sk}`,
          {bold:true, size:24, before:200, outline:1, color: markTag? "8A5A00": null});
  x += wP(`难度 ${DIFF[q.df]||q.df}　|　官方 score band ${q.bd||"—"}　|　题型 ${q.ty==="spr"?"填空":"四选一"}　|　Question ID ${q.id}`,
          {size:17, color:"6A7064"});
  if(q.sti){
    x += wP("材料", {bold:true, size:19, color:"8A5A00", before:120});
    x += blocksToXml(htmlToBlocks(await collectMedia(q.sti, media)), {size:21, media});
  }
  x += wP("题目", {bold:true, size:19, color:"8A5A00", before:120});
  x += blocksToXml(htmlToBlocks(await collectMedia(q.ste, media)), {size:21, bold:true, media});
  if(q.ty!=="spr") for(let k=0;k<q.op.length;k++){
    const L="ABCD"[k], o=q.op[k];
    const isAns = q.an.includes(L), isMine = a && a.picked===L;
    x += blocksToXml(htmlToBlocks(await collectMedia(o, media)), {
      size:21, ind:360, prefix:L+". ", media,
      bold: isAns, color: isAns?"1B6E39":(isMine?"A32A22":null)
    });
  }
  if(a){
    const verdict = a.ok? "正确" : "错误";
    x += wP(`你的作答：${a.picked||"未作答"}　|　正确答案：${q.an.join(" / ")}　|　${verdict}　|　用时 ${Math.round((a.ms||0)/1000)} 秒`,
            {size:19, bold:true, before:120, color:a.ok?"1B6E39":"A32A22", shade:a.ok?"E8F2EA":"F7E6E3"});
  }
  x += wP("College Board 官方解析", {bold:true, size:19, color:"8A5A00", before:120});
  x += blocksToXml(htmlToBlocks(await collectMedia(q.ra, media)), {size:20, media});
  if(note){
    x += wP("AI 拆解", {bold:true, size:19, color:"8A5A00", before:120});
    x += wP(note, {size:20});
  }
  x += wRule();
  return x;
}

function stamp(){
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

async function exportDocx(btn, items, meta, analysis){
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "生成中…";
  const media = [];
  try{
    let x = "";
    x += wP(meta.title, {bold:true, size:36, after:60, outline:0});
    x += wP(`${CURRENT} · 导出于 ${new Date().toLocaleString("zh-CN")}　|　题目来源：College Board SAT Suite Educator Question Bank（抓取于 ${PULLED_ON}）`,
            {size:17, color:"6A7064", after:160});
    if(meta.n!=null){
      x += wTable([
        ["作答","正确","错误","正确率","总用时","均时"],
        [String(meta.n), String(meta.ok), String(meta.n-meta.ok),
         (pct(meta.ok,meta.n)??"—")+"%",
         `${Math.floor(meta.secs/60)} 分 ${meta.secs%60} 秒`,
         `${meta.n?Math.round(meta.secs/meta.n):0} 秒`]
      ]);
    }
    if(analysis){
      x += wP("薄弱点分析", {bold:true, size:26, before:220, outline:1});
      x += wP(analysis, {size:21});
    }
    const markedN = items.filter(it=>marks[it.q.id]).length;
    x += wP("逐题记录" + (markedN? `（其中 ${markedN} 道标有【已标记】）`:""),
            {bold:true, size:26, before:240, outline:1});
    for(let i=0;i<items.length;i++){
      const it = items[i];
      if(i%5===0) btn.textContent = `生成中… ${i}/${items.length}`;
      const note = notesByQ[it.q.id] && notesByQ[it.q.id].text;
      x += await questionXml(it.q, it.st || it.a, i+1, note, media);
    }
    const failN = media.failed || 0;
    x += wP(`本文档含 ${media.length} 张由原题 SVG 转换的图片`
            + (failN? `；另有 ${failN} 张未能转换（原因：${media.failReason}），已改用官方文字描述代替` : "")
            + `。题目与官方解析版权归 College Board 所有，仅供个人备考使用。`,
            {size:16, color:"8A8F84", before:200});

    const blob = await buildDocx(x, media);
    const name = meta.title.replace(/[\\/:*?"<>|]/g,"·").slice(0,50) + " " + stamp() + ".docx";
    saveFile(name, blob);
    toast(`已生成 Word：${items.length} 题、${media.length} 张图`
          + (failN? `，${failN} 张图转换失败（${media.failReason}），已用文字描述代替` : ""));
  }catch(e){
    toast("导出失败（"+((e&&e.message)||"error")+"）");
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}

let aiThreads = {};          // qid -> [{role,content}]
let aiBusy = false;
let aiCtl = null;

function aiPanel(q, a){
  const p = el("div","aipanel");
  const head = el("div","aihead");
  head.innerHTML = `<span class="eyebrow">AI 分析</span>`;

async function sendAI(q, a, question, label){
  if(aiBusy) return;
  aiBusy = true;
  aiCtl = new AbortController();
  const th = aiThreads[q.id] = aiThreads[q.id] || [];
  th.push({role:"user", content:question, label});
  th.push({role:"assistant", content:""});
  saveThreads();
  rerenderAI(q,a);

  const history = th.slice(0,-2).map(m=>({role:m.role, content:m.content})).filter(m=>m.content);
  const msgs = buildMessages(q, a, question, history);
  const cur = th[th.length-1];
  try{
    const txt = await aiChat(msgs, {
      signal: aiCtl.signal,
      onText: t=>{
        cur.content = t;
        const lg = document.querySelector("#ailog");
        if(lg && lg.lastElementChild){ lg.lastElementChild.textContent = t; lg.scrollTop = lg.scrollHeight; }
      },
      onFallback: (name, code)=>{
        cur.content = `（${name} 失败：${code}，正在换下一个供应商…）`;
        const lg = document.querySelector("#ailog");
        if(lg && lg.lastElementChild) lg.lastElementChild.textContent = cur.content;
      },
    });
    cur.content = txt;
  }catch(e){
    cur.content = "✗ " + aiErrText(e && e.code, e && e.message) + (aiLastError? `\n\n最后一次错误：${aiLastError}`:"");
  }finally{
    aiBusy = false; aiCtl = null;
    saveThreads();
    rerenderAI(q,a);
  }
}

const RX_SCHEMA_PROMPT =

function rxPick(spec){
  const seen = new Set(attempts.map(a=>a.qid));
  const inSpec = q => q.sec===spec.sec && spec.skills.includes(q.sk)
    && (!spec.diffs.length || spec.diffs.includes(q.df));
  const shuffle = arr => { for(let i=arr.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
  let hard  = shuffle(BANK.filter(q=>inSpec(q) && q.df==="H"));
  let other = shuffle(BANK.filter(q=>inSpec(q) && q.df!=="H"));
  const fresh = a => { const f=a.filter(q=>!seen.has(q.id)); return f.length>=a.length*0.3 ? f.concat(a.filter(q=>seen.has(q.id))) : a; };
  hard = fresh(hard); other = fresh(other);
  const need = Math.min(spec.minHard, spec.n);
  const out = hard.slice(0, need);
  const rest = shuffle(other.concat(hard.slice(need)));
  out.push(...rest.slice(0, spec.n - out.length));
  return shuffle(out);
}
function runRx(spec){
  const qs = rxPick(spec);
  if(!qs.length) return toast("题库里没有符合这组条件的题");
  const hardN = qs.filter(q=>q.df==="H").length;
  spec.done = (spec.done||0)+1; saveRx();
  startRun(qs, {label: spec.label + `（Hard ${hardN}/${qs.length}）`, timed:false});
}

let hls = {};        // qid -> [被高亮的字符串]
const saveHls = ()=> lsSet(K("hls"), hls);

function addHl(qid, text){
  if(!qid || !text) return;
  hls[qid] = hls[qid] || [];
  if(!hls[qid].includes(text)) hls[qid].push(text);
  saveHls();
}
function removeHl(qid, text){
  if(!hls[qid]) return;
  hls[qid] = hls[qid].filter(t=>t!==text);
  if(!hls[qid].length) delete hls[qid];
  saveHls();
}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* 高亮增删之后刷新当前正在看的东西：答题界面 / 全屏或只看 / 普通页面 */
function refreshAfterHl(){
  const rv = document.querySelector("#view-run");
  const open = rv && !rv.classList.contains("hide");
  if(run && !run.finished && open) return drawRun();
  if(open && typeof redrawOverlay === "function" && redrawOverlay) return redrawOverlay();
  render();
}

/* 在已渲染好的 DOM 里把保存过的片段包成 <mark> */
function applyHighlights(root, qid){
  const list = hls[qid];
  if(!root || !list || !list.length) return;
  const re = new RegExp("(" + list.slice().sort((a,b)=>b.length-a.length).map(reEsc).join("|") + ")", "g");
  root.querySelectorAll(".qtext").forEach(box=>{
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, null);
    const todo = [];
    let n;
    while((n = walker.nextNode())){
      if(n.parentElement.closest("mark,.sr-only,math,svg")) continue;
      if(re.test(n.nodeValue)){ re.lastIndex = 0; todo.push(n); }
      re.lastIndex = 0;
    }
    todo.forEach(node=>{
      const frag = document.createDocumentFragment();
      let last = 0, m;
      re.lastIndex = 0;
      while((m = re.exec(node.nodeValue))){
        if(m.index > last) frag.appendChild(document.createTextNode(node.nodeValue.slice(last, m.index)));
        const mk = document.createElement("mark");
        mk.className = "hl"; mk.textContent = m[0]; mk.title = "点击取消高亮";
        mk.onclick = e=>{ e.stopPropagation(); removeHl(qid, m[0]); refreshAfterHl(); };
        frag.appendChild(mk);
        last = m.index + m[0].length;
      }
      if(last < node.nodeValue.length) frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  });
}

let splitRatio = 50;
function initSplit(){
  const v = +lsGet(NS+"_split", 50);
  if(v>=20 && v<=80) splitRatio = v;
}
const IDX_W = 170, CALC_W = 290, AI_W = 380;
function applySplit(body){
  if(!body) return;
  // 窄屏交给 CSS 的单列布局 —— 行内样式会盖过 media query，别在这里写死
  if(window.innerWidth<=900){ body.style.gridTemplateColumns=""; return; }
  const idx  = body.classList.contains("withidx")  ? IDX_W+"px " : "";
  const calc = (body.classList.contains("withcalc") ? " "+CALC_W+"px" : "")
             + (body.classList.contains("withai")   ? " "+AI_W+"px"   : "");
  if(body.classList.contains("single")){
    if(!idx && !calc){ body.style.gridTemplateColumns = ""; return; }   // 交给 CSS
    body.style.gridTemplateColumns = idx + "minmax(0,780px)" + calc;
    return;
  }
  body.style.gridTemplateColumns = `${idx}${splitRatio}fr 6px ${100-splitRatio}fr${calc}`;
}
function makeSplitter(body){
  const h = el("div","splitter");
  h.title = "拖动调整左右宽度，双击复位";
  let dragging = false;
  const move = e=>{
    if(!dragging) return;
    const r = body.getBoundingClientRect();
    const off = (body.classList.contains("withidx")? IDX_W:0);
    const wid = r.width - off - (body.classList.contains("withcalc")? CALC_W:0)
                              - (body.classList.contains("withai")? AI_W:0);
    const x = (e.touches? e.touches[0].clientX : e.clientX) - r.left - off;
    splitRatio = Math.max(20, Math.min(80, Math.round(x / Math.max(1,wid) * 100)));
    applySplit(body);
  };
  const up = ()=>{
    if(!dragging) return;
    dragging = false;
    document.body.classList.remove("dragging");
    lsSet(NS+"_split", splitRatio);
  };
  h.onmousedown = e=>{ e.preventDefault(); dragging=true; document.body.classList.add("dragging"); };
  h.ondblclick = ()=>{ splitRatio = 50; applySplit(body); lsSet(NS+"_split", 50); };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  h.addEventListener("touchstart", e=>{ dragging=true; }, {passive:true});
  document.addEventListener("touchmove", move, {passive:true});
  document.addEventListener("touchend", up);
  return h;
}

/* ============ 生词本 ============
   在题目文字上划选，弹出按钮存进生词本，连同那句话的上下文一起存。 */
function sentenceAround(node, word){
  let e = node.nodeType===3 ? node.parentElement : node;
  while(e && !/^(P|LI|TD|TH|DIV)$/.test(e.tagName) ) e = e.parentElement;
  const full = (e ? e.textContent : "").replace(/\s+/g," ").trim();
  if(!full) return word;
  const i = full.indexOf(word);
  if(i < 0) return full.slice(0, 240);
  // 往两边找到句子边界
  let a = full.lastIndexOf(".", i); const a2 = full.lastIndexOf("?", i); const a3 = full.lastIndexOf("!", i);
  a = Math.max(a, a2, a3);
  let b = full.length;
  for(const p of [".", "?", "!"]){ const j = full.indexOf(p, i+word.length); if(j>=0) b = Math.min(b, j+1); }
  return full.slice(a+1, b).trim() || full.slice(0,240);
}

let vocabPop = null;

function initVocabSelection(){

      // 从 DOM 上标的 data-qid 反查所属题目 —— 全屏、只看不做、错题本预览、答题界面通用。
      // 原来只看 run 和 previewQid，而 openFullscreen / openBrowse 两个视图都不设这两者，

      const holder = host.closest("[data-qid]");

             || (run && run.qs[run.i]) || (previewQid && BYID[previewQid]) || null;
      const r = sel.getRangeAt(0).getBoundingClientRect();
      const pop = el("div"); pop.id="vocabpop";
      pop.style.left = Math.max(8, Math.min(window.innerWidth-260, r.left + r.width/2 - 125)) + "px";
      pop.style.top  = (r.top > 70 ? r.top - 44 : r.bottom + 10) + "px";

      hb.onclick = ()=>{

        addHl(q.id, text);

        if(sel.removeAllRanges) sel.removeAllRanges();
        refreshAfterHl();
      };
      pop.appendChild(hb);
      const b = el("button","vpbtn", "＋ 生词本");
      b.onclick = ()=>{
        const ctx = sentenceAround(anchor, text);
        vocab = vocab.filter(v=>!(v.w===text && v.qid===(q&&q.id)));

      };
      pop.appendChild(b);

    }, 10);
  });
  document.addEventListener("scroll", killVocabPop, true);
}

  app.appendChild(head);
  if(!vocab.length){
    app.appendChild(el("div","empty","还没有生词。做题时用鼠标划选不认识的词，会弹出「存进生词本」。"));
    return;
  }

  const keyOf = v =>
    vFolder.by==="skill"   ? (v.sk || "（未标考点）")
  : vFolder.by==="session" ? (sessionLabelAt(v.ts) || NO_SESSION)
                           : monthKey(v.ts);
  const counts = {}, tsMax = {};
  if(vFolder.by!=="all") vocab.forEach(v=>{
    const k=keyOf(v); counts[k]=(counts[k]||0)+1;
    if((v.ts||0)>(tsMax[k]||0)) tsMax[k]=v.ts||0;
  });
  const keys = Object.keys(counts).sort(
    vFolder.by==="skill" ? (a2,b2)=> counts[b2]-counts[a2]
                         : (a2,b2)=> (tsMax[b2]||0)-(tsMax[a2]||0));
  if(vFolder.by!=="all" && (!vFolder.val || !counts[vFolder.val])) vFolder.val = keys[0] || "";
  const list = vocab.filter(v=> vFolder.by==="all" || keyOf(v)===vFolder.val)
                    .slice().sort((a2,b2)=>(b2.ts||0)-(a2.ts||0));

  const bar = el("div","selbar");
  bar.appendChild(el("span","cnt", `${list.length} / ${vocab.length} 条`));
  bar.appendChild(el("div","spacer"));
  const dl = el("button","ghost","导出这组 TXT");
  dl.onclick=()=>{
    const txt = list.map(v=>
      `${v.w}\n  语境：${v.ctx}\n  来自：${v.sk||"—"}  ${new Date(v.ts).toLocaleDateString("zh-CN")}\n`).join("\n");
    saveFile(`生词本 ${todayKey()}.txt`, new Blob([txt],{type:"text/plain;charset=utf-8"}));
  };
  bar.appendChild(dl);
  if(list.length>1){
    const quiz = el("button","ghost","看原题（全部）");
    quiz.title = "把这组生词出现过的题一次摊开，左边索引栏可以跳";
    quiz.onclick=()=>{
      const qs=[], seen=new Set();
      list.forEach(v=>{ if(v.qid && BYID[v.qid] && !seen.has(v.qid)){ seen.add(v.qid); qs.push(BYID[v.qid]); } });
      if(!qs.length) return toast("这组生词没有能回溯的原题");
      openFullscreen(qs, "生词出处 · "+(vFolder.by==="all"?"全部":vFolder.val), 0, {reveal:true});
    };
    bar.appendChild(quiz);
  }
  const clr = el("button","ghost","清空全部");
  clr.onclick=()=>{ if(confirm(`删除全部 ${vocab.length} 条生词？`)){ vocab=[]; saveVocab(); render(); } };
  bar.appendChild(clr);
  app.appendChild(bar);

  const split = el("div","logsplit");
  const leftCol = el("div","logleft");
  leftCol.appendChild(folderBox(vFolder, counts, keys, ()=>render()));
  split.appendChild(leftCol);

  const right = el("div","vlist");
  if(!list.length) right.appendChild(el("div","empty","这个分组下没有生词。"));
  list.forEach(v=>{
    const c = el("div","vcard");
    const hi = esc(v.ctx).replace(new RegExp(esc(v.w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),
      m=>`<mark>${m}</mark>`);
    c.innerHTML = `<div class="vw">${esc(v.w)}</div>
      <div class="vctx">${hi}</div>
      <div class="vmeta">${esc(v.sk||"—")} · ${new Date(v.ts).toLocaleDateString("zh-CN")}${
        sessionLabelAt(v.ts)? " · "+esc(sessionLabelAt(v.ts)) : ""}</div>`;
    const row = el("div","btnrow"); row.style.justifyContent="flex-start"; row.style.marginTop="9px";
    if(v.qid && BYID[v.qid]){
      const go = el("button","drillbtn","看原题");
      go.onclick=()=>openFullscreen([BYID[v.qid]], "生词出处 · "+v.w, 0);
      row.appendChild(go);
    }
    const del = el("button","drillbtn","删除");
    del.onclick=()=>{ vocab=vocab.filter(x=>!(x.w===v.w&&x.ts===v.ts)); saveVocab(); render(); };
    row.appendChild(del);
    c.appendChild(row);
    right.appendChild(c);
  });
  split.appendChild(right);
  app.appendChild(split);
}

/* ============ 浏览器前进/后退 ============ */
let navLock = false;
function pushView(v){
  if(navLock) return;
  try{ history.pushState({v}, "", "#"+v); }catch(e){}
}
function initHistory(){
  try{ history.replaceState({v:view}, "", "#"+view); }catch(e){}
  window.addEventListener("popstate", ev=>{
    navLock = true;
    const rv = $("#view-run");
    if(rv && !rv.classList.contains("hide")){      // 全屏/答题界面：后退 = 退出它
      if(run && run.mock && !run.finished){ navLock=false; history.pushState({v:view},"","#"+view); return; }
      rv.classList.add("hide"); rv.innerHTML=""; document.body.style.overflow="";
      run = null; mockPlan = null;
      render(); navLock = false; return;
    }
    const v = (ev.state && ev.state.v) || (location.hash||"#home").slice(1) || "home";
    if(["home","records","log","paper","settings","source","vocab"].includes(v)){ view = v; render(); }
    navLock = false;
  });
}

/* ============ 练习记录 ============
   一场练习 = 一条 session + 若干条 attempt。旧数据没有 sid，用时间区间兜底。 */
/* 某个时间点落在哪一场练习里 —— 生词本按「作业」分组要用 */
function sessionLabelAt(ts){
  if(!ts) return "";
  const pad = 60000;
  const hit = sessions.filter(x=>ts>=x.startTs-pad && ts<=x.endTs+pad).slice(-1)[0];
  return hit ? (hit.label||"练习") : "";
}
const NO_SESSION = "（不属于某次练习）";
const monthKey = ts => ts ? new Date(ts).toISOString().slice(0,7).replace("-"," 年 ")+" 月" : "（无日期）";

/* 左边那一列的分组菜单。by: skill | session | month | all */
const FOLDER_TABS = [["skill","按题型"],["session","按作业"],["month","按月份"],["all","全部"]];
function folderBox(state, counts, keys, onPick){
  const fold = el("div","folders");
  const fTabs = el("div","gtabs"); fTabs.style.marginBottom="0";
  FOLDER_TABS.forEach(([k,t])=>{
    const b=el("button",null,t);
    b.setAttribute("aria-current", state.by===k?"page":"false");
    b.onclick=()=>{ state.by=k; state.val=""; onPick(); };
    fTabs.appendChild(b);
  });
  fold.appendChild(fTabs);
  if(state.by!=="all"){
    if(keys.length){
      const fl = el("div","folderlist");
      keys.forEach(k=>{
        const b = el("button","folderitem"+(state.val===k?" on":""));
        b.innerHTML = `<span class="fname">${esc(k)}</span><span class="fcount num">${counts[k]}</span>`;
        b.onclick=()=>{ state.val=k; onPick(); };
        fl.appendChild(b);
      });
      fold.appendChild(fl);
    }else fold.appendChild(el("div","hint","这个分法下还没有东西。"));
  }
  return fold;
}

function sessionAttempts(sess){
  if(sess.sid){
    const byId = attempts.filter(a=>a.sid===sess.sid);
    if(byId.length) return byId;
  }
  const pad = 60000;   // 老记录：落在这一场起止时间内（前后各放宽 1 分钟）
  return attempts.filter(a=> a.ts>=sess.startTs-pad && a.ts<=sess.endTs+pad
                          && (!sess.label || a.session===sess.label));
}

/* 对错一览：一排编号方块，绿=对 红=错 灰=未答，右上角小点=已标记。点开看题。 */
function resultGrid(rows, opt){
  opt = opt||{};
  const g = el("div","rgrid");
  rows.forEach((r,i)=>{
    const q = r.q, a = r.a;
    const unanswered = !a || a.picked==null || String(a.picked).trim()==="";
    const cls = unanswered ? "skip" : (a.ok ? "ok" : "no");
    const b = el("button","rcell "+cls+(marks[q.id]?" mk":""), String(i+1));
    b.title = `${i+1}. ${q.sk} · ${DIFF[q.df]||q.df}` +
      (unanswered? " · 未作答" : ` · 你选 ${a.picked}，正确 ${q.an.join("/")}`) +
      (marks[q.id]? " · 已标记":"");
    b.onclick = ()=> openFullscreen(rows.map(x=>x.q), opt.label||"查看", i, {reveal:true});
    g.appendChild(b);
  });
  return g;
}

function gridLegend(rows){
  const n = rows.length;
  const ok = rows.filter(r=>r.a && r.a.ok).length;
  const skip = rows.filter(r=>!r.a || r.a.picked==null || String(r.a.picked).trim()==="").length;
  const mk = rows.filter(r=>marks[r.q.id]).length;
  const l = el("div","rlegend");
  l.innerHTML = `<span><i class="sw ok"></i>对 ${ok}</span>
    <span><i class="sw no"></i>错 ${n-ok-skip}</span>
    ${skip?`<span><i class="sw skip"></i>未答 ${skip}</span>`:""}
    ${mk?`<span><i class="sw mk"></i>标记 ${mk}</span>`:""}
    <span class="dim">点方块看那道题</span>`;
  return l;
}

function sessionRows(sess){
  const list = sessionAttempts(sess);
  const seen = new Set();
  const rows = [];
  // 优先按这一场记下的题序还原
  (sess.qids||[]).forEach(qid=>{
    if(!BYID[qid]) return;
    const a = list.filter(x=>x.qid===qid).slice(-1)[0] || null;
    rows.push({q:BYID[qid], a}); seen.add(qid);
  });
  list.forEach(a=>{ if(!seen.has(a.qid) && BYID[a.qid]){ rows.push({q:BYID[a.qid], a}); seen.add(a.qid); } });
  return rows;
}

let openSession = null;

function renderRecords(app){
  const head = el("div","pagehead");
  head.innerHTML = `<div><h1>练习记录</h1>
    <p>每一场练过什么、哪些对哪些错。点开可以重做错题或整场重来。</p></div>`;
  app.appendChild(head);

  if(!sessions.length){
    app.appendChild(el("div","empty","还没有练习记录。去控制台做一组题就会出现在这里。"));
    return;
  }

  const ts = timeStats();
  const strip = el("div","timestrip");
  strip.innerHTML = `
    <div><b class="num">${sessions.length}</b><span>总场次</span></div>
    <div><b class="num">${minutesOf(ts.today)}</b><span>今天（分钟）</span></div>
    <div><b class="num">${minutesOf(ts.week)}</b><span>本周（分钟）</span></div>
    <div><b class="num">${(ts.all/3600000).toFixed(1)}</b><span>累计（小时）</span></div>
    <div><b class="num">${ts.days}</b><span>练习天数</span></div>`;
  app.appendChild(strip);

  sessions.slice().reverse().forEach(sess=>{
    const key = sess.sid || String(sess.startTs);
    const open = openSession===key;
    const card = el("div","reccard"+(open?" open":""));
    const acc = sess.n ? Math.round(sess.ok/sess.n*100) : 0;
    const d = new Date(sess.endTs);
    const head2 = el("button","rechead");
    head2.innerHTML = `
      <span class="rmain">
        <span class="rtop"><b>${esc(sess.label||"练习")}</b>
          ${sess.mode==="mock"?'<span class="kindtag rule">模考</span>':''}</span>
        <span class="rsub num">${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}
          ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}
          · ${minutesOf(sess.activeMs)} 分钟${sess.n?` · 均 ${Math.round(sess.activeMs/sess.n/1000)} 秒/题`:""}</span>
      </span>
      <span class="rnums">
        <span class="skn"><b class="num">${sess.ok}/${sess.n}</b><i>对/做</i></span>
        ${sess.marked?`<span class="skn"><b class="num">${sess.marked}</b><i>标记</i></span>`:""}
        <span class="acc"><span class="accbar"><i class="${acc>=85?"good":(acc<65?"warn":"")}"
          style="width:${acc}%"></i></span><span class="accnum">${acc}%</span></span>
      </span>
      <span class="skchev">${open?"▾":"▸"}</span>`;
    head2.onclick=()=>{ openSession = open? null : key; render(); };
    card.appendChild(head2);

    if(open){
      const body = el("div","recbody");
      const rows = sessionRows(sess);
      if(!rows.length){
        body.appendChild(el("div","hint","这一场的逐题记录找不到了（可能是很早的记录，或作答已被清空）。"));
      }else{
        body.appendChild(gridLegend(rows));
        body.appendChild(resultGrid(rows, {label:sess.label}));
        // 按考点小结
        const bySk = {};
        rows.forEach(r=>{ const k=r.q.sk; (bySk[k]=bySk[k]||{n:0,ok:0}); bySk[k].n++; if(r.a&&r.a.ok) bySk[k].ok++; });
        const wrongSk = Object.entries(bySk).filter(([,v])=>v.ok<v.n)
          .sort((a,b)=>(a[1].ok/a[1].n)-(b[1].ok/b[1].n));
        if(sess.mode==="mock" && rows.length){
          const bySec = {};
          rows.forEach(r=>{ const k=r.q.sec; (bySec[k]=bySec[k]||{n:0,ok:0}); bySec[k].n++; if(r.a&&r.a.ok) bySec[k].ok++; });
          const parts = Object.entries(bySec).map(([sec,v])=>{
            const s2 = scaledScore(+sec, v.ok, v.n);
            return `${(MOCK[sec]||{name:"?"}).name} <b>${s2.lo}–${s2.hi}</b>（原始分 ${v.ok}/${v.n}）`;
          });
          const totv = Object.entries(bySec).reduce((a,[sec,v])=>{
            const s2=scaledScore(+sec,v.ok,v.n); return {lo:a.lo+s2.lo, hi:a.hi+s2.hi}; },{lo:0,hi:0});
          body.appendChild(el("div","recsk",
            `估算分：${parts.join("　·　")}` +
            (Object.keys(bySec).length===2? `　→　总分 <b>${totv.lo}–${totv.hi}</b>`:"") +
            `<br><span style="color:var(--ink-3)">按官方 Practice Test 11 评分表、按题数等比折算，折算方式为本工具近似。</span>`));
        }
        if(wrongSk.length){
          body.appendChild(el("div","recsk",
            "失分考点：" + wrongSk.map(([k,v])=>`${esc(k)} ${v.ok}/${v.n}`).join("　·　")));
        }
        const wrongQs = rows.filter(r=>r.a && !r.a.ok).map(r=>r.q);
        const markedQs = rows.filter(r=>marks[r.q.id]).map(r=>r.q);
        const foot = el("div","btnrow"); foot.style.justifyContent="flex-start"; foot.style.marginTop="14px";
        const mk=(t,fn,primary)=>{ const b=el("button",primary?"primary":"drillbtn",t); b.onclick=fn; foot.appendChild(b); return b; };
        mk("逐题看解析", ()=>openFullscreen(rows.map(r=>r.q), sess.label||"查看", 0, {reveal:true}));
        if(wrongQs.length) mk(`重做错的 ${wrongQs.length} 题`,
          ()=>startRun(wrongQs,{label:"重做 · "+(sess.label||"练习"), timed:false}), true);
        if(markedQs.length) mk(`练标记的 ${markedQs.length} 题`,
          ()=>startRun(markedQs,{label:"标记 · "+(sess.label||"练习"), timed:false}));
        mk("整场重做", ()=>startRun(rows.map(r=>r.q),{label:(sess.label||"练习")+" 重做", timed:false}));
        const dl = mk("导出 Word", ()=>exportDocx(dl, rows.map(r=>({q:r.q, a:r.a})),
          {title:"SAT 练习 · "+(sess.label||""), n:sess.n, ok:sess.ok,
           secs:Math.round(sess.activeMs/1000)}, ""));
        const ren = mk("重命名", ()=>{
          const v = prompt("这一场的名字", sess.label||"");
          if(v==null) return;
          sess.label = v.trim() || sess.label;
          lsSet(K("sessions"), sessions); render();
        });
        const del = mk("删除这条", async ()=>{
          if(!confirm("只删这条练习记录，作答和错题集保留。确定？")) return;
          sessions = sessions.filter(x=>(x.sid||String(x.startTs))!==key);
          lsSet(K("sessions"), sessions); openSession=null; render();
        });
        body.appendChild(foot);
      }
      card.appendChild(body);
    }
    app.appendChild(card);
  });
}

let logFilter = {sec:0, dom:"", onlyDue:false, hideMastered:true};
let folder = {by:"skill", val:""};    // skill | session | month | all —— 默认按题型分
function toggleMastered(qid){
  if(mastered[qid]) delete mastered[qid];
  else { mastered[qid] = Date.now(); delete reviewQ[qid]; flushReview(); }
  saveMastered();
}
let bulkMode  = false;      // 默认关闭，点「批量」才出勾选框
let previewQid = null;

let showMistakes = false;     // 错题本默认不标错，打开才显示当时错在哪
function questionPanel(q, a, opts){

    body.appendChild(n);

function openFullscreen(qs, label, startIdx, opt){
  let fsReveal = !opt || opt.reveal!==false;
  let fsIdx = qs.length>1 && (!opt || opt.index!==false);   // 左边的小索引栏
  const root=$("#view-run"); root.innerHTML="";
  root.classList.remove("hide");
  document.body.style.overflow="hidden";
  try{ history.pushState({v:view, run:1}, "", "#view"); }catch(e){}
  let i = startIdx||0;
  const draw=()=>{
    root.innerHTML="";
    const q = qs[i];
    const a = attempts.filter(x=>x.qid===q.id).slice(-1)[0] || null;
    const bar = el("div","runbar");
    bar.innerHTML = `<span class="qn">${i+1} / ${qs.length}</span><span class="tag">${esc(label)}</span>`;
    bar.appendChild(el("div","spacer"));
    bar.appendChild(sizeControl());
    const rvb = el("button","ghost", fsReveal? "隐藏答案":"显示答案");
    rvb.onclick=()=>{ fsReveal=!fsReveal; draw(); };
    bar.appendChild(rvb);
    if(qs.length>1){
      const ib = el("button","ghost","索引");
      ib.setAttribute("aria-pressed", fsIdx);
      ib.title = "左边列出这一组的全部题目，点哪道跳哪道";
      ib.onclick=()=>{ fsIdx=!fsIdx; draw(); };
      bar.appendChild(ib);
    }
    const mk = el("button","ghost", marks[q.id]?"已标记":"标记");
    mk.setAttribute("aria-pressed", !!marks[q.id]);
    mk.onclick=()=>{ toggleMark(q.id); draw(); };
    bar.appendChild(mk);
    const doIt = el("button","ghost","做这道");
    doIt.onclick=()=>{ root.innerHTML=""; startRun([q],{label:q.sk,timed:false}); };
    bar.appendChild(doIt);
    const dl1 = el("button","ghost","下载这道");
    dl1.onclick=()=>exportDocx(dl1, [{q, a}], {title:"SAT 单题 · "+q.sk}, "");
    bar.appendChild(dl1);
    const x = el("button","ghost","关闭");
    x.onclick=()=>{ root.classList.add("hide"); root.innerHTML=""; document.body.style.overflow="";
                    redrawOverlay=null; render(); };
    bar.appendChild(x);
    root.appendChild(bar);
    const body = el("div","runbody"+(q.sti?"":" single")+(fsIdx?" withidx":""));
    body.dataset.qid = q.id;
    if(fsIdx){
      // 小索引栏：这一组有哪些题、当时对还是错，点一下就跳过去
      const ix = el("div","qindex");
      ix.dataset.keepscroll = "qindex";
      ix.appendChild(el("div","eyebrow ixhead", `${qs.length} 题`));
      qs.forEach((qq,k)=>{
        const aa = attempts.filter(x=>x.qid===qq.id).slice(-1)[0] || null;
        const stt = !aa || aa.picked==null || String(aa.picked).trim()==="" ? "skip" : (aa.ok?"ok":"no");
        const b = el("button","ixrow"+(k===i?" on":""));

/* ============ 导入试卷 ============
   PDF 用 pdf.js 取文字，Word(.docx) 用 JSZip 读 word/document.xml。
   取到的纯文本交给 DeepSeek 结构化成题目，再按标准考试配速计时。 */
let papers = [];        // 存下来的自制试卷
let importText = "";    // 当前提取出的文本

/* 浏览器的同源策略禁止用跨域 URL 构造 Worker：
   new Worker("https://cdnjs.cloudflare.com/...") 直接抛 SecurityError。
   pdf.js 会退回主线程的「假 worker」，但那条退路在 3.x 上常常也失败，
   于是文档对象建出来了、不报错，但每页 getTextContent() 返回空 —— 表现就是「没读到文字」。
   标准解法是用 blob 包一层：worker 内部的 importScripts() 是允许跨域的。 */
const PDF_WORKER_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pdfWorkerReady = false;
function setupPdfWorker(){
  if(pdfWorkerReady) return;
  try{
    const blob = new Blob([`importScripts(${JSON.stringify(PDF_WORKER_URL)});`],
                          {type:"application/javascript"});
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
  }catch(e){
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_URL;   // 兜底：让 pdf.js 自己去退化
  }
  pdfWorkerReady = true;
}

async function extractPdf(file){
  if(typeof pdfjsLib==="undefined") throw new Error("PDF 解析库没加载成功，检查网络");
  setupPdfWorker();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const out = [];
  const diag = {pages: pdf.numPages, items: [], worker: String(pdfjsLib.GlobalWorkerOptions.workerSrc).slice(0,5)};
  window.__pdfDiag = diag;
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    diag.items.push((tc.items||[]).length);
    let last=null, line="";
    const lines=[];
    tc.items.forEach(it=>{
      const y = it.transform[5];
      if(last!==null && Math.abs(y-last)>3){ lines.push(line.trim()); line=""; }
      line += it.str + (it.hasEOL? " " : "");
      last = y;
    });
    if(line.trim()) lines.push(line.trim());
    out.push(lines.filter(Boolean).join("\n"));
  }
  return out.join("\n\n");
}

async function extractDocx(file){
  if(typeof JSZip==="undefined") throw new Error("JSZip 没加载成功，检查网络");
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const f = zip.file("word/document.xml");
  if(!f) throw new Error("这不像是一个 .docx 文件");
  const xml = await f.async("string");
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const err = doc.querySelector("parsererror");
  if(err) throw new Error("document.xml 解析失败，文件可能损坏");
  const out = [];
  Array.from(doc.getElementsByTagNameNS(W,"p")).forEach(p=>{
    let t = "";
    Array.from(p.getElementsByTagNameNS(W,"t")).forEach(n=>{ t += n.textContent; });
    out.push(t.trim());
  });
  return out.filter(Boolean).join("\n");
}

const PAPER_RULES =
`下面是从一份试卷文件里提取出来的纯文本。把它整理成结构化的题目。

要求：
- 只整理文本里真实存在的题目，不要自己出题、不要补全缺失的题目。
- 一道题一个对象。四选一的题 options 放 4 个选项的文本（不要带 A. B. C. 前缀）；填空题 options 留空数组。
- answer 填正确答案：选择题填 "A"/"B"/"C"/"D"，填空题填答案本身。如果原文没给答案，answer 填 null。
- explanation 填原文里的解析；原文没有就填 null，不要自己编解析。
- stimulus 放题目依赖的阅读材料或题干背景（没有就填空字符串），stem 放实际发问的那句话。
- section 填 "rw"（英文阅读/语法）或 "math"（数学）。
- 数学公式用普通文本写，比如 x^2、sqrt(3)、(a+b)/2。
- 文本里的页眉页脚、页码、答题卡说明一律忽略。

只输出一个 JSON 数组，不要任何解释文字，不要 markdown 代码围栏。格式：
[{"section":"rw","stimulus":"","stem":"","options":["","","",""],"answer":"A","explanation":null}]

如果这段文本里找不到任何题目，就输出 []。

---

`;

function parseJsonLoose(txt){
  let t = String(txt||"").trim();
  t = t.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");
  try{ return JSON.parse(t); }catch(e){}
  const a = t.indexOf("["), b = t.lastIndexOf("]");
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  throw new Error("模型返回的不是合法 JSON");
}

function toQuestion(o, idx, paperId){
  const secN = (o.section==="math") ? 2 : 1;
  const opts = Array.isArray(o.options)? o.options.filter(x=>x!=null && String(x).trim()!=="") : [];
  const ty = opts.length>=2 ? "mcq" : "spr";
  let an = [];
  if(o.answer!=null && String(o.answer).trim()!==""){
    an = [String(o.answer).trim().toUpperCase().slice(0, ty==="mcq"?1:40)];
    if(ty==="spr") an = [String(o.answer).trim()];
  }
  return {
    id: paperId+"-q"+idx, eid:"", custom:true, paper:paperId,
    sec: secN, dom:"ZZ", domName:"导入试卷", sk:"导入试卷", skc:"ZZ",
    df:"M", bd:0, ty,
    sti: o.stimulus? `<p>${esc(o.stimulus)}</p>` : "",
    ste: `<p>${esc(o.stem||"（无题干）")}</p>`,
    op: opts.slice(0,4).map(x=>`<p>${esc(x)}</p>`),
    an,
    ra: o.explanation? `<p>${esc(o.explanation)}</p>` : "<p>这道题来自导入的文件，原文没有提供解析。可以用下面的「AI 拆解」让模型讲。</p>"
  };
}

// 官方配速：R&W 32min/27题 ≈ 71 秒，Math 35min/22题 ≈ 95 秒
const PACE = {1:71, 2:95};
function paperMinutes(qs){
  const sec = qs.reduce((t,q)=>t+PACE[q.sec], 0);
  return Math.max(1, Math.round(sec/60));
}

                   if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
  fi.onchange=()=>{ if(fi.files[0]) handleFile(fi.files[0]); };
  card.appendChild(drop); card.appendChild(fi);

  // 直接粘贴：截图 OCR 出来的文字、网页上复制的题、聊天记录里的题，都能走这条路
  const pasteWrap = el("div","field"); pasteWrap.style.marginTop="12px";

  pta.placeholder = "任何格式的题目文字都行。扫描件 / 图片请先用别的工具 OCR 成文字再贴进来。";
  pasteWrap.appendChild(pta);
  const pbtn = el("button","drillbtn","用这段文字");
  pbtn.style.marginTop="8px";
  pbtn.onclick=()=>{
    const t = pta.value.trim();
    if(t.length<20) return toast("文字太短，认不出题目");
    importText = t;
    $("#impstatus").innerHTML = `已读入粘贴的 <b>${t.length.toLocaleString()}</b> 字符`;
    showPreview("粘贴的文字");
  };
  pasteWrap.appendChild(pbtn);
  card.appendChild(pasteWrap);

  const status = el("div","impstatus"); status.id="impstatus"; card.appendChild(status);
  const preview = el("div"); preview.id="imppreview"; card.appendChild(preview);
  app.appendChild(card);

  async function handleFile(file){
    const st = $("#impstatus"); const pv = $("#imppreview");
    pv.innerHTML=""; importText="";
    st.innerHTML = '<span class="spin"></span> 正在读取 '+esc(file.name)+'…';
    try{
      const name = file.name.toLowerCase();
      if(name.endsWith(".pdf")) importText = await extractPdf(file);
      else if(name.endsWith(".docx")) importText = await extractDocx(file);
      else if(/\.(txt|md|markdown|csv|json)$/.test(name) || (file.type||"").startsWith("text/"))
        importText = await file.text();
      else throw new Error("支持 .pdf / .docx / .txt / .md / .csv。老的 .doc 先另存为 .docx；"
                         + "别的格式可以把文字复制到下面的粘贴框里。");
      if(!importText.trim()){
        const diag = window.__pdfDiag || {};
        throw new Error(
          `没读到文字（共 ${diag.pages||"?"} 页，各页文字块数：${(diag.items||[]).join("/")||"?"}）。`
          + (diag.pages && (diag.items||[]).every(n=>n===0)
              ? "每一页都是 0 个文字块 —— 这份 PDF 很可能是扫描件/图片，需要先做 OCR。"
              : "如果页数为 ? 或解析中断，多半是 PDF 解析 worker 没跑起来，把这整句话发我。"));
      }
      const d = window.__pdfDiag;
      st.innerHTML = `已提取 <b>${importText.length.toLocaleString()}</b> 字符（${esc(file.name)}`
        + (d && d.pages? `，${d.pages} 页`:"") + `）`;
      showPreview(file.name);
    }catch(e){
      st.innerHTML = `<span style="color:var(--bad)">读取失败：${esc(e.message)}</span>`;
    }
  }

  function showPreview(fname){
    const pv = $("#imppreview");
    pv.innerHTML = "";
    const ta = el("textarea"); ta.className="pref"; ta.rows=8;
    ta.value = importText.slice(0, 4000) + (importText.length>4000? "\n…（预览截断，整理时会用全文）":"");
    ta.readOnly = true;
    pv.appendChild(el("div","hint","提取到的文字（可以先确认一下有没有读串行）："));
    pv.appendChild(ta);
    const foot = el("footer");
    const info = el("span","avail","");
    foot.appendChild(info);
    const go = el("button","primary","让 DeepSeek 整理成试卷");
    go.disabled = !hasKey();
    go.onclick = ()=>buildPaper(fname, go, info);
    foot.appendChild(go);
    pv.appendChild(foot);
  }

  async function buildPaper(fname, btn, info){
    btn.disabled = true;
    const CHUNK = 24000;
    const chunks = [];
    for(let i=0;i<importText.length;i+=CHUNK) chunks.push(importText.slice(i,i+CHUNK));
    let all = [];
    try{
      for(let i=0;i<chunks.length;i++){
        info.innerHTML = `<span class="spin"></span> 正在整理第 ${i+1} / ${chunks.length} 段…`;
        const txt = await dsChat(PAPER_RULES + chunks[i], {temperature:0});
        const arr = parseJsonLoose(txt);
        if(Array.isArray(arr)) all = all.concat(arr);
      }
    }catch(e){
      info.innerHTML = `<span style="color:var(--bad)">${esc(dsErrorText(e && e.code, e && e.message))}</span>`;
      btn.disabled=false; return;
    }
    if(!all.length){
      info.innerHTML = `<span style="color:var(--bad)">没能从这份文件里认出题目。检查一下是不是纯文字的题目文件。</span>`;
      btn.disabled=false; return;
    }
    const paperId = "p"+Date.now().toString(36);
    const qs = all.map((o,i)=>toQuestion(o,i,paperId));
    const noAns = qs.filter(q=>!q.an.length).length;
    const paper = {id:paperId, name:fname, ts:Date.now(), n:qs.length, noAns, qs};
    papers.push(paper); lsSet(K("papers"), papers);
    qs.forEach(q=>BYID[q.id]=q);
    info.textContent = "";
    toast(`整理出 ${qs.length} 道题`);
    render();
  }

  // 已保存的试卷
  if(papers.length){
    const blk = el("section","block"); blk.style.marginTop="26px";
    blk.innerHTML = `<div class="blockhead"><h2>我的试卷</h2>
      <span class="note">存在本机，导出进度时不包含</span></div>`;
    papers.slice().reverse().forEach(p=>{
      const c = el("div","logcard");
      c.innerHTML = `<header>
          <span class="tag chip">${esc(p.name)}</span>
          <span class="tag chip">${p.n} 题</span>
          <span class="tag chip">建议 ${paperMinutes(p.qs)} 分钟</span>
          ${p.noAns? `<span class="why-t">${p.noAns} 题没有答案</span>`:""}
          <span class="skmeta" style="margin-left:auto">${new Date(p.ts).toLocaleDateString("zh-CN")}</span>
        </header>`;
      const row = el("div","btnrow"); row.style.justifyContent="flex-start"; row.style.marginTop="10px";
      const go = el("button","drillbtn","按标准时间作答");
      go.onclick=()=>{
        p.qs.forEach(q=>BYID[q.id]=q);
        run = null;
        startRun(p.qs, {label:"试卷 · "+p.name, timed:true});
        run.deadline = Date.now() + paperMinutes(p.qs)*60000;
        run.paperTimed = true;
        drawRun();
      };
      const un = el("button","drillbtn","不计时作答");
      un.onclick=()=>{ p.qs.forEach(q=>BYID[q.id]=q); startRun(p.qs,{label:"试卷 · "+p.name, timed:false}); };
      const del = el("button","drillbtn","删除");
      del.onclick=()=>{ if(confirm("删除这份试卷？")){ papers=papers.filter(x=>x.id!==p.id);
                        lsSet(K("papers"),papers); render(); } };
      row.appendChild(go); row.appendChild(un); row.appendChild(del);
      c.appendChild(row);
      blk.appendChild(c);
    });
    app.appendChild(blk);
  }
}

/* ============ 数据体检与找回 ============
   没有服务器，所有记录都在本机 localStorage。这个面板把实际存了什么原样列出来，
   并处理一种真实会发生的情况：账户系统上线前的数据存在无前缀的旧键里，
   当时如果走的是「登录」而不是「注册」，迁移不会触发，数据就留在旧键没搬过来。 */
const LEGACY_KEYS = [NS+"_attempts",NS+"_review",NS+"_notes",NS+"_settings",NS+"_sessions",
                     NS+"_papers",NS+"_marks",NS+"_hls",NS+"_vocab",NS+"_threads",NS+"_mastered"];

function scanStorage(){
  const out = {accounts:{}, legacy:{}, other:{}, totalBytes:0};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    const v = localStorage.getItem(k) || "";
    out.totalBytes += k.length + v.length;
    let n = null;
    try{ const p=JSON.parse(v); n = Array.isArray(p)? p.length : (p&&typeof p==="object"? Object.keys(p).length : null); }catch(e){}
    const rec = {bytes:v.length, count:n};
    const m = k.match(new RegExp("^"+NS+":([^:]+):(.+)$"));
    if(m){ (out.accounts[m[1]] = out.accounts[m[1]] || {})[m[2]] = rec; }
    else if(LEGACY_KEYS.includes(k)) out.legacy[k] = rec;
    else if(k.startsWith(NS+"_")) out.other[k] = rec;
  }
  return out;
}

function adoptLegacy(){
  let moved = [];
  LEGACY_KEYS.forEach(k=>{
    const v = localStorage.getItem(k);
    if(v==null) return;
    const name = k.replace(NS+"_","");
    const target = K(name);
    const existing = localStorage.getItem(target);
    if(existing==null){ localStorage.setItem(target, v); moved.push(name+"（搬入）"); }
    else {
      // 当前账户已有同名数据：合并而不是覆盖
      try{
        const a=JSON.parse(existing), b=JSON.parse(v);
        if(Array.isArray(a)&&Array.isArray(b)){
          const seen=new Set(a.map(x=>x.aid||x.sid||JSON.stringify(x)));
          const add=b.filter(x=>!seen.has(x.aid||x.sid||JSON.stringify(x)));
          localStorage.setItem(target, JSON.stringify(a.concat(add)));
          moved.push(`${name}（合并 +${add.length}）`);
        }else if(a&&b&&typeof a==="object"&&typeof b==="object"){
          let c=0; Object.keys(b).forEach(kk=>{ if(!(kk in a)){ a[kk]=b[kk]; c++; } });
          localStorage.setItem(target, JSON.stringify(a));
          moved.push(`${name}（合并 +${c}）`);
        }
      }catch(e){}
    }
  });
  return moved;
}

function renderDiag(app){
  const b = el("section","block");
  b.innerHTML = `<div class="blockhead"><h2>数据体检</h2>
    <span class="note">这台浏览器里实际存了什么，原样列出</span></div>`;
  const card = el("div","builder");
  const s = scanStorage();

  if(IS_MIRROR){
    const mi = mirrorInfo(), prodN = nsKeys(PROD_NS).length;
    const box = el("div","gnote");
    box.innerHTML = `<b>这是镜像站</b>，记录和正式站分开存（前缀 <code>${NS}</code>，正式站是 <code>${PROD_NS}</code>）。
      在这里做题、改设置都不会影响正式站。<br>` +
      (mi ? `上次从正式站复制：${new Date(mi.copiedAt).toLocaleString()}，${mi.keys} 项 · ${kb(mi.chars)}。`
          : "还没有从正式站复制过。") +
      (prodN ? ` 正式站现在有 ${prodN} 项 · ${kb(storageChars(nsKeys(PROD_NS)))}。`
             : " 这个浏览器里找不到正式站的数据。");
    if(prodN){
      const go = el("button","ghost","从正式站重新复制（覆盖镜像里的记录）");
      go.style.marginTop="9px";
      go.onclick=()=>{
        if(!confirm("用正式站现在的数据整体替换镜像里的全部记录？镜像这边做过的题会被覆盖。正式站不受影响。")) return;
        const r = copyFromProd();
        if(!r.ok) return toast("没有复制：" + r.why, 5000);
        toast(`已复制 ${r.profiles} 个档案（${kb(r.chars)}），正在重新载入…`);
        setTimeout(()=>location.reload(), 600);
      };
      box.appendChild(el("br")); box.appendChild(go);
    }
    card.appendChild(box);
  }

  const legacyN = Object.keys(s.legacy).length;
  if(legacyN){
    const warn = el("div","gnote");
    const att = s.legacy[NS+"_attempts"];
    warn.innerHTML = `<b>发现 ${legacyN} 项没有归属账户的旧数据</b>${
      att&&att.count!=null? `，其中作答记录 <b>${att.count}</b> 条` : ""}。
      这是账户系统上线前存下的。点下面的按钮搬进当前账户「${esc(CURRENT)}」——
      已有同名数据会<b>合并</b>而不是覆盖。`;
    const go = el("button","primary","搬进当前账户");
    go.style.marginTop="9px";
    go.onclick=()=>{
      const moved = adoptLegacy();
      if(!moved.length) return toast("没有可搬的数据");
      LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));
      loadAll(); render();
      toast("已搬入：" + moved.join("、"));
    };
    warn.appendChild(go);
    card.appendChild(warn);
  }

  const mkTable = (title, obj)=>{
    const keys = Object.keys(obj);
    if(!keys.length) return null;
    const wrap = el("div"); wrap.style.marginBottom="14px";
    wrap.appendChild(el("div","eyebrow", title));
    const tw = el("div","tablewrap"); tw.style.marginTop="6px";
    const t = el("table","skills");
    t.innerHTML = `<thead><tr><th>项目</th><th class="r">条数</th><th class="r">占用</th></tr></thead>`;
    const tb = el("tbody");
    keys.sort().forEach(k=>{
      const r = obj[k];
      const tr = el("tr","skillrow");
      tr.innerHTML = `<td class="skname">${esc(k)}</td>
        <td class="r skmeta">${r.count==null?"—":r.count}</td>
        <td class="r skmeta">${(r.bytes/1024).toFixed(1)} KB</td>`;
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); wrap.appendChild(tw);
    return wrap;
  };

  const NAME = {attempts:"作答记录", review:"错题集", notes:"AI 拆解存档", sessions:"练习场次",
    marks:"标记的题", hls:"划词高亮", vocab:"生词本", threads:"AI 对话", mastered:"已掌握",
    papers:"导入的试卷", settings:"设置", providers:"模型配置", timed:"计时开关"};
  Object.keys(s.accounts).sort().forEach(acct=>{
    const pretty = {};
    Object.entries(s.accounts[acct]).forEach(([k,v])=>{ pretty[(NAME[k]||k)] = v; });
    const tbl = mkTable(`账户「${acct}」${acct===CURRENT?"（当前）":""}`, pretty);
    if(tbl) card.appendChild(tbl);
  });
  if(legacyN) card.appendChild(mkTable("未归属账户的旧数据", s.legacy));
  if(Object.keys(s.other).length) card.appendChild(mkTable("其它", s.other));

  card.appendChild(el("div","hint",
    `localStorage 合计占用约 ${(s.totalBytes/1024).toFixed(0)} KB（浏览器上限通常 5 MB）。
     <b>清浏览器缓存、换浏览器、无痕窗口都会让这些数据消失</b>，
     所以「练习数据 → 导出进度」建议每周做一次。`));
  b.appendChild(card);
  app.appendChild(b);
}

  ft.appendChild(el("label",null,"默认是否计时"));
  const trow = el("div","chips");
  [[false,"不计时"],[true,"计时"]].forEach(([v,t])=>{
    const b=el("button","chip",t);
    b.setAttribute("aria-pressed", !!cfg.timed===v);
    b.onclick=()=>{ cfg.timed=v; lsSet(K("timed"), v); render(); };
    trow.appendChild(b);
  });
  ft.appendChild(trow);
  ft.appendChild(el("div","hint",
    "新账户默认不计时。打开后，每组题会按官方配速（R&W 71 秒/题、Math 95 秒/题）得到一个总时限，"+
    "答题栏显示倒计时，到点自动交卷。关闭则只累计用时、不限时。"));
  cp.appendChild(ft);

  const fr = el("div","field");
  fr.appendChild(el("label",null,"答案什么时候出"));
  const rr = el("div","chips");
  [["end","做完整组再出答案"],["now","交一题出一题"]].forEach(([k,t])=>{
    const b=el("button","chip",t);
    b.setAttribute("aria-pressed", (settings.reveal||"end")===k);
    b.onclick=()=>{ settings.reveal=k; saveSettings(); render(); };
    rr.appendChild(b);
  });
  fr.appendChild(rr);
  fr.appendChild(el("div","hint",
    (settings.reveal==="now")
      ? "交一题出一题。<b>看解析的时间不计入答题用时</b> —— 提交后计时器会停表，显示「看解析·停表」，点下一题才重新走。"
      : "整组做完才统一判分，中途可以自由翻回去改答案，和真考一样。答题界面上仍有「立刻看这题答案」可以临时切换。"));
  cp.appendChild(fr);
  bp.appendChild(cp); app.appendChild(bp);

  /* --- 讲题偏好 --- */
  const b2 = el("section","block");
  b2.innerHTML = `<div class="blockhead"><h2>讲题偏好</h2>
    <span class="note">写在这里的要求，会拼进每一次拆解请求</span></div>`;
  const c2 = el("div","builder");
  const ta = el("textarea"); ta.rows=5; ta.className="pref";
  ta.placeholder = "例如：\n不要复述题干，直接说这道题考的能力\n语法题要把规则本身写出来，不要只说「注意主谓一致」\n数学题给出关键一步的推导，不要给完整过程\n可以用英文写术语，其余中文";
  ta.value = settings.pref||"";
  c2.appendChild(ta);
  const f2b = el("footer");
  const fbn = (settings.fb||[]).filter(f=>f.text && f.text.trim()).length;
  f2b.appendChild(el("span","avail",
    `另外已记录 <b>${fbn}</b> 条逐题反馈，最近 6 条会一起发给模型`));
  if(fbn){
    const clr = el("button","ghost","清空反馈");
    clr.onclick=()=>{ settings.fb=[]; saveSettings(); render(); };
    f2b.appendChild(clr);
  }
  const sp = el("button","primary","保存偏好");
  sp.onclick=()=>{ settings.pref = ta.value; saveSettings(); toast("已保存"); };
  f2b.appendChild(sp);
  c2.appendChild(f2b);
  b2.appendChild(c2); app.appendChild(b2);

  /* --- 数据 --- */
  const b3 = el("section","block");
  b3.innerHTML = `<div class="blockhead"><h2>练习数据</h2>
    <span class="note">换电脑：在这边导出，到那边导入</span></div>`;
  const c3 = el("div","builder");
  c3.appendChild(el("div","avail",
    `当前：<b>${attempts.length}</b> 条作答 · <b>${Object.keys(reviewQ).length}</b> 道错题 · <b>${Object.keys(notesByQ).length}</b> 条拆解记录`));
  const row = el("div","btnrow"); row.style.justifyContent="flex-start"; row.style.marginTop="14px";
  const ex = el("button","ghost","导出进度 JSON"); ex.onclick=exportProgress;
  row.appendChild(ex);
  const fileIn = el("input"); fileIn.type="file"; fileIn.accept="application/json,.json"; fileIn.className="hide";
  let mode="merge";
  fileIn.onchange=()=>{ if(fileIn.files[0]) importProgress(fileIn.files[0], mode); fileIn.value=""; };
  const im = el("button","ghost","导入并合并"); im.onclick=()=>{ mode="merge"; fileIn.click(); };
  const ir = el("button","ghost","导入并覆盖"); ir.onclick=()=>{
    if(confirm("覆盖会丢掉这台电脑上现有的全部记录，确定？")){ mode="replace"; fileIn.click(); } };
  row.appendChild(im); row.appendChild(ir); row.appendChild(fileIn);
  const wipe = el("button","ghost","清空本机数据");
  wipe.onclick=()=>{
    if(!confirm("清空这台浏览器上的作答、错题集和拆解记录？API key 和偏好会保留。")) return;
    attempts=[]; reviewQ={}; notesByQ={};
    saveLocal(); lsSet(K("review"),reviewQ); lsSet(K("notes"),notesByQ);
    toast("已清空"); render();
  };
  row.appendChild(wipe);
  c3.appendChild(row);
  // 原样备份：所有档案的全部东西，换电脑 / 搬到本地开发环境不丢生词本、标记、划线
  const row2 = el("div","btnrow"); row2.style.justifyContent="flex-start"; row2.style.marginTop="10px";
  const rx2 = el("button","ghost","原样备份（全部档案、全部数据）"); rx2.onclick=exportRaw;
  const rawIn = el("input"); rawIn.type="file"; rawIn.accept="application/json,.json"; rawIn.className="hide";
  rawIn.onchange=()=>{
    const f = rawIn.files[0]; rawIn.value=""; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      let d; try{ d = JSON.parse(fr.result); }catch(e){ return toast("文件不是合法的 JSON"); }
      const r = restoreRaw(d);
      if(!r.ok) return toast("没有恢复：" + r.why, 5000);
      toast(`已恢复 ${r.keys} 项，正在重新载入…`);
      setTimeout(()=>location.reload(), 600);
    };
    fr.readAsText(f);
  };
  const rr2 = el("button","ghost","从原样备份恢复");
  rr2.onclick=()=>{ if(confirm("恢复会用备份整体替换这里所有档案的全部记录（本机已配的 API key 会保留），确定？")) rawIn.click(); };
  row2.appendChild(rx2); row2.appendChild(rr2); row2.appendChild(rawIn);
  c3.appendChild(row2);
  c3.appendChild(el("div","hint",
    "导出的文件不含 API key。浏览器清缓存、换浏览器、无痕窗口都会丢记录，建议每周导出一次。"+
    "「导出进度」只带作答、错题、拆解三样；「原样备份」带全部（生词本、标记、划线、AI 对话、设置都在）。"));
  b3.appendChild(c3); app.appendChild(b3);

  /* --- 数据来源 / 数据体检 --- */
  const bSrc = el("section","block");
  bSrc.innerHTML = `<div class="blockhead"><h2>来源与本机数据</h2>
    <span class="note">题目出处、换算依据、已知局限，以及这台浏览器里实际存了什么</span></div>`;
  const srow = el("div","btnrow"); srow.style.justifyContent="flex-start";
  const sgo = el("button","drillbtn","数据来源与已知局限 →");
  sgo.onclick=()=>gotoView("source");
  srow.appendChild(sgo);
  bSrc.appendChild(srow);
  app.appendChild(bSrc);
  renderDiag(app);
}

/* ============ source view ============ */
function renderSource(app){
  const head = el("div","pagehead");
  head.innerHTML = `<div><h1>数据来源</h1><p>每一项数据的出处，以及已知的局限。</p></div>`;
  const back = el("button","ghost","← 回设置");
  back.onclick=()=>gotoView("settings");
  head.appendChild(back);
  app.appendChild(head);
  const p = el("div","prose");
  const byDom = DOM_ORDER.map(d=>{
    const n = BANK.filter(q=>q.dom===d).length;
    return `<li>${esc(DOMAINS[d].name)} — ${n} 题</li>`;
  }).join("");
  p.innerHTML = `
  <div class="warnbox"><p><b>题目全部来自 College Board 官方题库，非第三方改编、非我生成。</b>
    每道题在作答后都会显示它自己的 Question ID、external_id 和分类标签，可以逐题回官网核对。</p></div>

  <h3>题库</h3>
  <p>来源：<a href="https://satsuiteeducatorquestionbank.collegeboard.org/" target="_blank" rel="noopener">SAT Suite Educator Question Bank</a>，
     College Board 公开发布、无需登录。抓取接口：</p>
  <p><code>POST https://qbank-api.collegeboard.org/msreportingquestionbank-prod/questionbank/digital/get-questions</code><br>
     <code>POST https://qbank-api.collegeboard.org/msreportingquestionbank-prod/questionbank/digital/get-question</code></p>
  <p>抓取日期 ${esc(PULLED_ON)}。接口返回 3,770 条记录；其中 459 条是 <code>external_id</code> 为空的
     legacy 纸质书题目，结构不同且公式以 base64 图片内嵌，已排除。本工具收录 <b>${BANK.length}</b> 道数字 SAT 原生题，
     每道都带 College Board 官方逐选项解析（rationale）。</p>
  <ul>${byDom}</ul>

  <h3>考点数量为什么是 ${SKILLS.length} 个</h3>
  <p>官方规格文档里 Reading and Writing 列了 14 个 skill/knowledge testing point，是因为把 Command of Evidence
     拆成了 Textual 和 Quantitative 两条。但题库给每道题打的 <code>skill_desc</code> 标签把这两条合成了一个
     Command of Evidence。所以按题库的实际标签算，R&W 是 10 个、Math 是 19 个，合计 ${SKILLS.length} 个。
     本工具的考点表用的是题库标签，因为只有它能对应到具体题目。</p>

  <h3>考点与分数段</h3>
  <ul>
    <li>domain 占比与题数 — <a href="https://satsuite.collegeboard.org/media/pdf/digital-sat-test-spec-overview.pdf" target="_blank" rel="noopener">The Digital SAT Suite of Assessments Specifications Overview</a>，Table 2 / Table 3</li>
    <li>score band 对应分数区间 — <a href="https://satsuite.collegeboard.org/media/pdf/skills-insight-digital-sat-suite.pdf" target="_blank" rel="noopener">Skills Insight for the SAT Suite</a>，2026 年 7 月版，Table 3</li>
    <li>考点完整定义 — <a href="https://satsuite.collegeboard.org/media/pdf/assessment-framework-for-digital-sat-suite.pdf" target="_blank" rel="noopener">Assessment Framework for the Digital SAT Suite</a>, v3.01</li>
    <li>考试结构（54 题 / 64 分钟，44 题 / 70 分钟，两模块自适应）— <a href="https://satsuite.collegeboard.org/sat/whats-on-the-test/structure" target="_blank" rel="noopener">How the SAT Is Structured</a></li>
    <li>考试日期 — <a href="https://satsuite.collegeboard.org/sat/registration/dates-deadlines" target="_blank" rel="noopener">SAT Dates and Deadlines</a>（12 月 5 日场，报名截止 11 月 20 日）</li>
  </ul>

  <h3>已知局限</h3>
  <ul>
    <li><b>题库题不等于考场题。</b>Educator Question Bank 里的题是官方发布的练习题，不是某一次真考的原题。</li>
    <li><b>band 标签是题目属性，不是你的分数。</b><code>score_band_range_cd</code> 表示这道题主要区分哪个分数段的考生；
        控制台里的「band 5–7 正确率」是你在这批题上的表现，<b>不是预测分</b>。要拿分数只能做 Bluebook 完整自适应模考。</li>
    <li><b>本工具不自适应。</b>真考是两模块自适应，第二模块难度由第一模块表现决定；这里是定向刷题，用途不同。</li>
    <li><b>计时器只是节奏参考。</b>按 R&W 每题 ≈77 秒、Math ≈95 秒的平均配速提示，真考不按单题计时。</li>
    <li>少数题目的图形是内嵌 SVG，线条为黑色，因此图形一律放在白底板上显示，深色主题下也是白底。</li>
  </ul>

  <h3>账户</h3>
  <p>没有后端，所以这是<b>本机多用户档案</b>，不是真正的登录系统。密码经过 SHA-256 加盐后存在 localStorage，
     只用来在这台设备上把不同人的记录隔开 —— <b>能打开浏览器开发者工具的人就能读到数据</b>。别用你在别处用过的密码。
     每个账户的作答、错题集、标记、拆解、试卷、API key 和水平全部独立，换设备不会同步。</p>

  <h3>这个网站怎么跑的</h3>
  <p>纯静态页面，托管在 GitHub Pages 上，没有后端、没有数据库、不收集任何数据。
     题库（<code>bank.bin</code>，gzip 压缩的 JSON，约 4 MB）在打开时下载到浏览器里，之后答题、判分、看官方解析全在本地完成，不联网。</p>
  <p>练习记录存在你这台浏览器的 localStorage 里。<b>换电脑不会自动同步</b> —— 要用「设置 → 导出进度」拿一个 JSON 文件过去再导入。
     清浏览器缓存、换浏览器、开无痕窗口都会丢记录，建议每周导出一次。</p>
  <p>AI 拆解调用的是 DeepSeek 接口，浏览器直连。你的 API key 只存在自己浏览器的 localStorage 里，
     <b>不在网站代码里、不经过任何中间服务器</b>。这个网站是公开的，但每个访问者都用自己的 key、自己的记录，互相看不到。</p>

  <h3>哪些内容是官方的，哪些不是</h3>
  <ul>
    <li><b>官方</b> — 题目、材料、选项、正确答案，以及标着「College Board 官方解析」的那段 rationale。一字未改。</li>
    <li><b>非官方</b> — 标着「AI 拆解」和「本组薄弱点分析」的内容由 DeepSeek 生成，用来补官方解析不讲的部分：这道题考哪项能力、干扰项怎么设计的、你缺哪一块。
        它是模型推理的产物，<b>可能出错</b>；与官方解析冲突时以官方为准。</li>
    <li><b>非官方</b> — domain 和考点的中文译名、错题集的复习间隔（1/3/7/16 天）、
        模考的分数估算规则和 60% 路由阈值，都是这个工具自己定的。</li>
    <li><b>非官方</b> — 「导入试卷」里的题目来自你上传的文件，由模型整理，不是 College Board 的题。</li>
  </ul>

  <h3>模考模式</h3>
  <p>结构照搬官方规格：Reading and Writing 两个模块各 <b>27 题 / 32 分钟</b>，Math 两个模块各 <b>22 题 / 35 分钟</b>，
     两个 section 之间 <b>10 分钟休息</b>。每个模块内按官方 domain 配比抽题（R&W 约 8/7/7/5，Math 约 8/8/3/3），
     R&W 按 Craft and Structure → Information and Ideas → Standard English Conventions → Expression of Ideas 排序，
     每组内由易到难 —— 这些都和真考一致。</p>
  <p>第二模块会根据第一模块的正确率路由：<b>达到 60% 走难的那组，否则走易的那组</b>。
     模考期间不显示对错，全部交卷后一次性出报告。</p>
  <p><b>报告里的分数区间是估算，不是你的 SAT 分数。</b>估算规则写在报告里：按官方 score band 从高到低找，
     第一个「做够 4 题且正确率 ≥60%」的 band 就是落点，band 对应分数取自 Skills Insight Table 3。
     这是本工具自己定的规则。College Board 真正的算分基于 IRT 模型、换算表从未公开，任何第三方换算都是猜的。
     报告里的原始对错数、模块路由和分 band 正确率才是实打实的。</p>
  <p>另外：60% 这个路由阈值也是估的，官方没有公布真实的分流规则。</p>

  <h3>导入试卷</h3>
  <p>上传 PDF 或 .docx，由 DeepSeek 把文字整理成结构化题目。提示词里明确要求<b>只整理文件里真实存在的题，
     不许自己出题、不许编造答案和解析</b>；原文没给答案的题会标出来。</p>
  <p>这类题<b>不计入官方考点统计</b>（band 表、掌握度表都不算它们），因为它们没有 College Board 的考点和 band 标签。
     但会计入学习时长，错了也会进错题集。计时按官方配速折算：R&W 每题 71 秒、Math 每题 95 秒。</p>
  <p>限制：扫描件 / 图片 PDF 读不出文字（需要先 OCR）；老的 .doc 格式不支持，要先另存为 .docx；
     PDF 里的公式和图往往提取不全。整理结果<b>可能有错</b>，作答前建议扫一眼提取出的原文预览。</p>

  <h3>学习时长</h3>
  <p>每场练习记录净答题时长 —— <b>暂停的时间不计入</b>，模考休息的 10 分钟也不计入。
     控制台显示今天、本周、累计时长，以及练习天数和场次。</p>

  <h3>错题集怎么排的</h3>
  <p>做错的题自动进错题集，第 1 天到期。复习时答对就进下一个盒子（间隔 3 天 → 7 天 → 16 天），答错退回第 1 天重来；
     连续答对四轮后毕业、移出队列。这是 Leitner 间隔重复，不是 College Board 的方法，是通用记忆法。</p>

  <h3>你的练习记录</h3>
  <p>共 ${attempts.length} 次作答、${sessions.length} 场练习、累计 ${(timeStats().all/3600000).toFixed(1)} 小时、
     错题集 ${Object.keys(reviewQ).length} 题、已拆解 ${Object.keys(notesByQ).length} 题、自制试卷 ${papers.length} 份，全部在本机。
     记录字段：题号、考点、难度、band、你的选项、对错、耗时。</p>
  <p>Word 导出的是 .docx。题目里的数学公式用 College Board 自带的 <code>alttext</code> 英文读法还原，几何图形标为「[图形，见原题]」——
     公式和 SVG 图无法直接转进 Word，这是取舍，不是遗漏。</p>`;
  app.appendChild(p);
}

/* ============ wiring ============ */
function gotoView(v){ if(v!==view) pushView(v); view=v; picked.clear(); render(); }
document.querySelectorAll("nav.tabs button").forEach(b=>
  b.onclick = ()=>gotoView(b.dataset.view));
$("#whobtn").onclick = e=>{ e.stopPropagation(); openProfilePop($("#whobtn")); };
$("#themebtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
};
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && (e.key==="=" || e.key==="+" || e.key==="-" || e.key==="_")){
    e.preventDefault();
    rsIdx = Math.max(0, Math.min(RS_STEPS.length-1, rsIdx + (e.key==="-"||e.key==="_" ? -1 : 1)));
    applyScale(); return;
  }
  if(!run || run.finished || $("#view-run").classList.contains("hide")) return;
  const st = run.state[run.i], q = run.qs[run.i];
  // 计算器开着就把键盘交给它 —— 不然按 1234 是在选 ABCD，根本打不了数
  if(calcOpen && q.sec===2 && calcKeydown(e)){ e.preventDefault(); return; }
  // 正在输入框里打字（填空题、AI 提问框）时不抢键
  const ae = document.activeElement;
  if(ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.isContentEditable)){
    if(e.key!=="Escape") return;
  }
  if(e.key==="Escape") return endRun();
  if(q.ty!=="spr" && !st.sub && /^[1-4abcdABCD]$/.test(e.key)){
    const idx = "1234".includes(e.key) ? +e.key-1 : "abcd".indexOf(e.key.toLowerCase());
    if(idx>=0 && idx<q.op.length){ st.picked="ABCD"[idx]; drawRun(); }
  }
  if(e.key==="Enter"){
    if(run.mock){
      saveTime();
      if(run.i < run.qs.length-1){ run.i++; run.t0=Date.now(); drawRun(); }
      return;
    }
    if(!st.sub && st.picked) submit();
    else if(st.sub){
      saveTime();
      if(run.i===run.qs.length-1) endRun();
      else { run.i++; run.t0=Date.now(); drawRun(); }
    }
  }
});

boot();
</script>
