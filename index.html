<meta charset="utf-8">
<title>Band Seven</title>
<meta name="description" content="3,311 道 College Board 官方数字 SAT 题，按考点与官方分数段出题，带官方解析、错题集间隔复习和 AI 逐题拆解。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --paper:#F1F3EE; --surface:#FBFBF8; --surface-2:#E9ECE4;
  --ink:#191C18; --ink-2:#4C534B; --ink-3:#767D73;
  --rule:#D8DCD1; --rule-2:#C3C8B9;
  --accent:#8A5A00; --accent-soft:#F0E3C8; --accent-ink:#5E3D00;
  --ok:#1B6E39; --ok-soft:#DCEDE0; --bad:#A32A22; --bad-soft:#F5DEDA;
  --b1:#D5DAD0; --b2:#D6D9C2; --b3:#E1D6B0; --b4:#E8CC93;
  --b5:#EBBF6D; --b6:#DFA63C; --b7:#C4890F; --band-ink:#26251A;
  --shadow:0 1px 2px rgba(25,28,24,.06),0 4px 14px rgba(25,28,24,.05);
  --r:5px;
  --rs:1;   /* 阅读字号倍率，由顶栏的 A−/A+ 控制 */
  --f-ui:"Archivo",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131513; --surface:#1B1E1A; --surface-2:#252924;
    --ink:#E7EAE3; --ink-2:#A8AFA4; --ink-3:#7E857A;
    --rule:#2C312B; --rule-2:#3C423A;
    --accent:#E3A93C; --accent-soft:#3A2E15; --accent-ink:#F0C878;
    --ok:#63C687; --ok-soft:#17301F; --bad:#EE8B82; --bad-soft:#331A17;
    --b1:#333831; --b2:#3C4034; --b3:#4B4632; --b4:#5C4E2D;
    --b5:#6F5A28; --b6:#8A6D1F; --b7:#A8821A; --band-ink:#EDE6D2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#131513; --surface:#1B1E1A; --surface-2:#252924;
  --ink:#E7EAE3; --ink-2:#A8AFA4; --ink-3:#7E857A;
  --rule:#2C312B; --rule-2:#3C423A;
  --accent:#E3A93C; --accent-soft:#3A2E15; --accent-ink:#F0C878;
  --ok:#63C687; --ok-soft:#17301F; --bad:#EE8B82; --bad-soft:#331A17;
  --b1:#333831; --b2:#3C4034; --b3:#4B4632; --b4:#5C4E2D;
  --b5:#6F5A28; --b6:#8A6D1F; --b7:#A8821A; --band-ink:#EDE6D2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.hide{display:none!important}
/* College Board 的题干用 <span class="sr-only">blank</span> 给屏幕阅读器读「空格」，
   页面上必须视觉隐藏，否则填空处会多出一个 blank 字样 */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- shell ---------- */
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;
  padding:0 20px;height:52px;background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:15px}
.brand .mk{width:9px;height:9px;background:var(--accent);border-radius:1px;transform:translateY(-1px)}
.brand .mirrortag{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:3px;
  background:var(--accent);color:var(--surface);transform:translateY(-1px);cursor:help}
nav.tabs{display:flex;gap:2px;margin-left:6px}
nav.tabs button{padding:6px 11px;border-radius:var(--r);color:var(--ink-2);font-weight:500;font-size:13px}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--surface);font-weight:600}
.spacer{flex:1}
.sizectl{display:flex;align-items:center;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;flex:none}
.sizectl button{padding:5px 10px;font-weight:700;color:var(--ink-2);line-height:1.1}
.sizectl button:first-child{font-size:11px}
.sizectl button:last-child{font-size:15px}
.sizectl button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.sizectl button:disabled{opacity:.3;cursor:default}
.sizectl .lbl{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);padding:0 6px;min-width:34px;
  text-align:center;border-left:1px solid var(--rule-2);border-right:1px solid var(--rule-2);align-self:stretch;
  display:flex;align-items:center;justify-content:center}
.ghost{padding:6px 12px;border:1px solid var(--rule-2);border-radius:var(--r);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}

/* ---------- home ---------- */
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:25px}
.pagehead p{margin:3px 0 0;color:var(--ink-2);font-size:13.5px;max-width:62ch}
.countdown{margin-left:auto;text-align:right;border-left:2px solid var(--accent);padding-left:14px}
.countdown b{display:block;font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.03em}

.strip{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
@media(max-width:760px){.strip{grid-template-columns:1fr}}
.meter{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px 17px}
.meter header{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}
.meter header h3{font-size:14px}
.meter header .now{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.bands{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.band{position:relative;height:34px;border-radius:2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;color:var(--band-ink);font-size:9.5px;font-weight:600;opacity:.34}
.band.on{opacity:1}
.band .r{font-family:var(--f-num);font-size:8.5px;font-weight:500;opacity:.85}
.band.cur{outline:2px solid var(--ink);outline-offset:2px}
.band.tgt::after{content:"";position:absolute;inset:-2px;border:2px dashed var(--ink-3);border-radius:3px}
.meter footer{display:flex;gap:20px;margin-top:13px;padding-top:12px;border-top:1px solid var(--rule)}
.meter footer div{display:flex;flex-direction:column;gap:1px}
.meter footer b{font-family:var(--f-num);font-size:17px;font-weight:700;letter-spacing:-.02em}
.meter footer span{font-size:10.5px;color:var(--ink-3)}

/* ---------- skill table ---------- */
section.block{margin-bottom:30px}
.blockhead{display:flex;align-items:baseline;gap:12px;margin-bottom:11px}
.blockhead h2{font-size:16px}
.blockhead .note{font-size:12px;color:var(--ink-3);margin-left:auto}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
table.skills{width:100%;border-collapse:collapse;min-width:660px}
table.skills th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface)}
table.skills th.r,table.skills td.r{text-align:right}
table.skills td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.skills tr:last-child td{border-bottom:none}
tr.domrow td{background:var(--surface-2);padding:6px 12px}
tr.domrow .dn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tr.domrow .dm{font-family:var(--f-num);font-size:11px;color:var(--ink-2);font-weight:500}
tr.skillrow:hover td{background:var(--surface-2)}
.skname{font-weight:500;font-size:13px}
.skmeta{font-family:var(--f-num);font-size:11px;color:var(--ink-3)}
.acc{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.accbar{width:82px;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;flex:none}
.accbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.accbar i.good{background:var(--ok)} .accbar i.warn{background:var(--bad)}
.accnum{font-family:var(--f-num);font-size:12.5px;font-weight:600;width:42px;text-align:right}
.dim{color:var(--ink-3)}
.drillbtn{padding:4px 10px;border:1px solid var(--rule-2);border-radius:var(--r);font-size:11.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.drillbtn:hover{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- drill builder ---------- */
.builder{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:17px 18px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.preset{text-align:left;padding:9px 13px;border:1px solid var(--rule-2);border-radius:var(--r);min-width:150px}
.preset:hover{border-color:var(--accent);background:var(--accent-soft)}
.preset b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.preset span{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 9px;border:1px solid var(--rule-2);border-radius:99px;font-size:11.5px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--rule-2);
  border-radius:var(--r);background:var(--surface);color:var(--ink);width:100%}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.builder footer{display:flex;align-items:center;gap:14px;margin-top:17px;padding-top:15px;border-top:1px solid var(--rule)}
.avail{font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.avail b{color:var(--ink);font-weight:700}
.primary{margin-left:auto;padding:9px 20px;background:var(--ink);color:var(--surface);
  border-radius:var(--r);font-weight:600;font-size:13.5px}
.primary:hover{background:var(--accent)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.primary:disabled:hover{background:var(--ink)}

/* ---------- practice ---------- */
#view-run{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column}
.runbar{display:flex;align-items:center;gap:14px;height:48px;padding:0 18px;
  background:var(--surface);border-bottom:1px solid var(--rule);flex:none}
.runbar .qn{font-family:var(--f-num);font-size:12px;font-weight:600;padding:3px 9px;
  border:1px solid var(--rule-2);border-radius:var(--r);color:var(--ink-2);line-height:1.35}
.runbar .tag{padding:2.5px 8px;border-radius:99px;background:var(--surface-2);font-size:11px;font-weight:500;color:var(--ink-2)}
.bandpip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-size:11px;color:var(--ink-2)}
.bandpip i{width:8px;height:8px;border-radius:2px}
.timer{font-family:var(--f-num);font-size:14px;font-weight:600;letter-spacing:-.01em}
.timer.warn{color:var(--bad)}
.markbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.progressline{height:2px;background:var(--surface-2);flex:none}
.progressline i{display:block;height:100%;background:var(--accent);transition:width .25s}

.runbody{flex:1;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.runbody.single{grid-template-columns:minmax(0,780px);justify-content:center}
@media(max-width:900px){.runbody{grid-template-columns:1fr;overflow-y:auto}}
.pane{overflow-y:auto;padding:26px 30px 40px}
.pane.left{border-right:1px solid var(--rule)}
@media(max-width:900px){.pane.left{border-right:none;border-bottom:1px solid var(--rule)}}
.pane-inner{max-width:640px;margin:0 auto}
.qindex{overflow-y:auto;border-right:1px solid var(--rule);background:var(--surface-2);padding:8px 6px}
.ixhead{padding:2px 6px 7px}
.ixrow{display:flex;align-items:center;gap:6px;width:100%;padding:5px 7px;border-radius:3px;text-align:left}
.ixrow:hover{background:var(--surface)}
.ixrow.on{background:var(--ink);color:var(--surface)}
.ixrow .ixn{font-size:11px;min-width:17px;opacity:.75}
.ixdot{width:7px;height:7px;border-radius:99px;flex:none;background:var(--ink-3)}
.ixdot.ok{background:var(--ok)} .ixdot.no{background:var(--bad)}
.ixsk{font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ixmk{font-size:9.5px;opacity:.8}
@media(max-width:900px){.qindex{display:none}}
.vlist{display:flex;flex-direction:column;gap:10px;min-width:0}
.jumprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.jumprow .jlab{font-size:11px;color:var(--ink-3)}

.qtext{font-family:var(--f-read);font-size:calc(16px * var(--rs));line-height:1.62;color:var(--ink)}
.qtext p{margin:0 0 .85em}
.qtext p:last-child{margin-bottom:0}
.qtext em,.qtext i{font-style:italic}
.qtext ul,.qtext ol{margin:.6em 0;padding-left:1.4em}
.qtext li{margin-bottom:.35em}
.qtext table{border-collapse:collapse;margin:1em 0;font-family:var(--f-ui);font-size:13px}
.qtext th,.qtext td{border:1px solid var(--rule-2);padding:6px 11px;text-align:left}
.qtext th{background:var(--surface-2);font-weight:600}
.qtext math{font-size:1.03em}
/* CB figures are inline SVG stroked in near-black — always give them a paper plate */
.qtext figure{margin:1em 0;display:flex;justify-content:center;overflow-x:auto}
.qtext figure svg,.qtext svg{background:#fff;border:1px solid var(--rule-2);border-radius:3px;padding:10px;max-width:100%;height:auto}
.stimwrap{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:22px 24px}
.stemtext{font-family:var(--f-read);font-size:calc(16px * var(--rs));line-height:1.55;font-weight:600;margin-bottom:18px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;
  padding:12px 14px;background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--r)}
.opt:hover{border-color:var(--ink-3)}
.opt .ltr{flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--rule-2);
  display:grid;place-items:center;font-family:var(--f-num);font-size:11.5px;font-weight:700;color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt[aria-pressed="true"] .ltr{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt .oc{font-family:var(--f-read);font-size:calc(15px * var(--rs));line-height:1.5;padding-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.chosen-wrong .ltr{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.struck .oc{opacity:.4;text-decoration:line-through}
.opt:disabled{cursor:default}

.sprbox{display:flex;flex-direction:column;gap:8px}
.sprbox input{font-family:var(--f-num);font-size:calc(19px * var(--rs));font-weight:600;padding:12px 15px;
  border:1.5px solid var(--rule-2);border-radius:var(--r);background:var(--surface);color:var(--ink);width:100%}
.sprbox .hint{font-size:11.5px;color:var(--ink-3)}

.runfoot{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);
  border-top:1px solid var(--rule);flex:none;flex-wrap:wrap}
.navdots{display:flex;gap:3px;flex-wrap:wrap;max-width:44%}
.dot{width:19px;height:19px;border-radius:3px;border:1px solid var(--rule-2);font-family:var(--f-num);
  font-size:9.5px;font-weight:600;color:var(--ink-3);display:grid;place-items:center}
.dot.done{background:var(--surface-2);color:var(--ink-2)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.no{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
.dot.marked::after{content:"";position:absolute;margin:-14px 0 0 12px;width:5px;height:5px;background:var(--accent);border-radius:50%}

/* ---------- review ---------- */
.verdict{display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:var(--r);margin-bottom:16px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict b{font-size:14px;font-weight:700}
.verdict .ans{margin-left:auto;font-family:var(--f-num);font-size:12.5px;font-weight:600}
.rat{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:var(--r);padding:17px 19px;margin-bottom:15px}
.rat .eyebrow{margin-bottom:9px}
.rat .qtext{font-size:calc(14.5px * var(--rs));line-height:1.66}
.why{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px;margin-bottom:15px}
.why .eyebrow{margin-bottom:4px}
.why .sub{font-size:12px;color:var(--ink-3);margin-bottom:10px}

/* source attribution — the user asked for every item to carry its provenance */
.srcbox{border:1px dashed var(--rule-2);border-radius:var(--r);padding:12px 14px;background:transparent}
.srcbox .eyebrow{margin-bottom:8px}
.srcgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:11.5px}
.srcgrid dt{color:var(--ink-3)}
.srcgrid dd{margin:0;font-family:var(--f-num);font-size:11px;word-break:break-all}
.srcgrid dd a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}

/* ---------- summary / log / source views ---------- */
.summary{max-width:620px;margin:0 auto;text-align:center;padding:40px 0}
.summary .big{font-family:var(--f-num);font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1}
.summary .sub{color:var(--ink-2);margin:6px 0 26px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.sumgrid div{background:var(--surface);padding:14px 12px}
.sumgrid b{display:block;font-family:var(--f-num);font-size:21px;font-weight:700;letter-spacing:-.02em}
.sumgrid span{font-size:10.5px;color:var(--ink-3)}
.btnrow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

.logcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px;margin-bottom:10px}
.logcard header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.logcard .why-t{padding:2.5px 9px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-size:11px;font-weight:600}
.logcard .q{font-family:var(--f-read);font-size:calc(14px * var(--rs));color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ============ boot ============ */
async function inflate(url){
  const r = await fetch(url, {cache:"force-cache"});
  if(!r.ok) throw new Error("题库下载失败 HTTP "+r.status);
  const buf = await r.arrayBuffer();
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

async function boot(){
  try{
    BANK = await inflate(BANK_URL);
  }catch(e){
    $("#boot").innerHTML = '<div class="prose" style="padding:30px;max-width:520px">'+
      '<h3>题库加载失败</h3>'+
      '<p>可能的原因：网络问题；或浏览器太旧不支持 DecompressionStream（需要 Chrome 80+ / Safari 16.4+ / Firefox 113+）；'+
      '或者 bank.bin 没和 index.html 放在同一个目录。</p>'+
      '<p><code>'+esc(e.message)+'</code></p></div>';
    return;
  }
  BANK.forEach(q=>BYID[q.id]=q);
  buildSkillIndex();
  // 镜像站第一次打开：镜像这边还什么都没有，就把正式站的账号整套复制过来
  let mirrorNote = "";
  if(IS_MIRROR){
    markMirror();

      const r = copyFromProd();
      mirrorNote = r.ok ? `镜像站：已从正式站复制 ${r.profiles} 个档案的全部记录（${kb(r.chars)}）`
                        : "镜像站：没能从正式站复制 —— "+r.why;
    }
  }
  try{ const v=+localStorage.getItem(NS+"_rs"); if(v>=0 && v<RS_STEPS.length) rsIdx=v; }catch(e){}
  $("#topsize").appendChild(sizeControl());
  applyScale();
  initVocabSelection();
  initSplit();
  initHistory();
  $("#boot").remove();

  // 打开就进。只有「这台浏览器上有好几个档案、又没记住上次是谁」时才问一句。
  const who = resolveProfile();
  if(who){
    CURRENT = who;
    lsSet(NS+"_session", who); lsSet(NS+"_last", who);

    if(hasLegacy()){ const n = migrateLegacy(); if(n) note = `已把之前 ${n} 项记录放进「${who}」`; }

function buildSkillIndex(){

/* ============ 用户档案 ============
   没有后端，所以这是「本机多用户档案」：几个人共用一台电脑时各自的记录互不相干。
   **没有密码、没有登录。** 密码在纯前端里本来也挡不住任何人（能开开发者工具就能看到数据），
   只是每次打开都要输一遍，徒增麻烦 —— 所以直接取消，打开就进，顶栏可以随时换人。
   档案之间的进度完全独立，也不会跨设备同步。 */
let CURRENT = null;
const K = name => NS+":" + (CURRENT||"_guest") + ":" + name;
const DEFAULT_PROFILE = "我";

const users     = ()=> lsGet(NS+"_users", {});
const setUsers  = u => lsSet(NS+"_users", u);
const profileNames = ()=> Object.keys(users());

function createProfile(name){
  name = String(name||"").trim();
  if(name.length < 1) throw new Error("名字不能是空的");
  if(name.length > 16) throw new Error("名字最多 16 个字");
  const u = users();
  if(u[name]) throw new Error("已经有一个叫「"+name+"」的档案了");
  u[name] = {created: Date.now(), level:{rw:null, math:null, source:"unset"}};
  setUsers(u);
  return name;
}
function renameProfile(oldName, newName){
  newName = String(newName||"").trim();
  const u = users();
  if(!u[oldName]) throw new Error("没有这个档案");
  if(newName===oldName) return oldName;
  if(!newName.length) throw new Error("名字不能是空的");
  if(u[newName]) throw new Error("已经有一个叫「"+newName+"」的档案了");
  // 记录是按 "<NS>:<名字>:<键>" 存的，改名要把键一起搬过去
  const pre = NS+":"+oldName+":";
  const moves = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(pre)) moves.push(k);
  }
  moves.forEach(k=>{
    const v = localStorage.getItem(k);
    localStorage.setItem(NS+":"+newName+":"+k.slice(pre.length), v);
    localStorage.removeItem(k);
  });
  u[newName] = u[oldName]; delete u[oldName];
  setUsers(u);
  if(CURRENT===oldName){ CURRENT = newName; lsSet(NS+"_session", newName); lsSet(NS+"_last", newName); }
  return newName;
}
function deleteProfile(name){
  const u = users();
  if(!u[name]) return;
  const pre = NS+":"+name+":";
  const kill = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(pre)) kill.push(k);
  }
  kill.forEach(k=>localStorage.removeItem(k));
  delete u[name]; setUsers(u);
}
function switchProfile(name){
  if(!users()[name]) return;
  lsSet(NS+"_session", name); lsSet(NS+"_last", name);
  location.reload();        // 整页重来最干净：所有内存里的数组都要换一套
}

/* 这台浏览器上的档案，以及各自存了多少东西 */

    }catch(e){ return 0; } };
    return {name, attempts:g("attempts"), sessions:g("sessions"),
            review:g("review"), marks:g("marks"), created:(all[name]||{}).created};

/* 把档案系统之前的老数据搬进第一个档案 */
const LEGACY = [NS+"_attempts",NS+"_review",NS+"_notes",NS+"_settings",NS+"_sessions",NS+"_papers",NS+"_marks"];
function hasLegacy(){ return LEGACY.some(k=>localStorage.getItem(k)!=null); }
function migrateLegacy(){
  let moved = 0;
  LEGACY.forEach(k=>{
    const v = localStorage.getItem(k);
    if(v==null) return;
    const name = k.replace(NS+"_","");
    if(localStorage.getItem(K(name))==null){ localStorage.setItem(K(name), v); moved++; }
    localStorage.removeItem(k);
  });
  return moved;
}

/* 打开网站时决定用哪个档案：
   记住的那个 → 上次用的 → 只有一个就用它 → 一个都没有就建一个。
   返回 null 表示「有好几个档案、但不知道这次是谁」，交给选人面板。 */
function resolveProfile(){
  const all = users(), names = Object.keys(all);
  const sess = lsGet(NS+"_session","");
  if(sess && all[sess]) return sess;
  const last = lsGet(NS+"_last","");
  if(last && all[last]) return last;
  if(names.length === 1) return names[0];
  if(names.length === 0) return createProfile(DEFAULT_PROFILE);
  return null;
}

/* ============ 整个命名空间的搬运：镜像复制 / 原样备份 / 原样恢复 ============
   一个命名空间 = localStorage 里所有 "<ns>_xxx"（全局）和 "<ns>:<档案>:<键>"（每个档案）的键。
   三件事都归结为「把本命名空间整体换成另一份」，共用 replaceNamespace：
   先算空间、再写，写到一半爆了就整体回滚到原样。 */
const MIRROR_MAX_CHARS = 3e6;   // 复制后整个源最多占这么多字符。Chrome 上限约 520 万，留出一半给正式站继续长
function nsKeys(ns){
  const out = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && (k.startsWith(ns+"_") || k.startsWith(ns+":"))) out.push(k);
  }
  return out;
}
function storageChars(keys){
  let n = 0;
  (keys || Array.from({length:localStorage.length}, (_,i)=>localStorage.key(i))).forEach(k=>{
    if(k!=null) n += k.length + (localStorage.getItem(k)||"").length;
  });
  return n;
}
const kb = n => (n/1024).toFixed(0)+" KB";
/* pairs: [[去掉前缀的尾巴, 值], …]，尾巴形如 "_users" 或 ":我:attempts" */
function replaceNamespace(pairs){
  const old = nsKeys(NS);
  const add = pairs.reduce((n,[t,v])=>n + NS.length + t.length + v.length, 0);
  const after = storageChars() - storageChars(old) + add;
  if(after > MIRROR_MAX_CHARS)
    return {ok:false, why:`写入后这个网址下的存储会到 ${kb(after)}，超过安全线 ${kb(MIRROR_MAX_CHARS)}，怕挤掉正式站的空间，没有写`};
  const backup = old.map(k=>[k, localStorage.getItem(k)]);
  try{
    old.forEach(k=>localStorage.removeItem(k));
    pairs.forEach(([t,v])=>localStorage.setItem(NS+t, v));
  }catch(e){
    nsKeys(NS).forEach(k=>localStorage.removeItem(k));
    backup.forEach(([k,v])=>{ try{ localStorage.setItem(k,v); }catch(_){} });
    return {ok:false, why:"浏览器存储空间不够，已经撤回，原来的数据没动"};
  }
  return {ok:true, keys:pairs.length, chars:add};
}

/* ---- 镜像站：把正式站的账号原样复制过来（只读正式站，绝不写它） ---- */
function copyFromProd(){
  if(!IS_MIRROR) return {ok:false, why:"这里就是正式站"};
  const src = nsKeys(PROD_NS);
  if(!src.length) return {ok:false, why:"这个浏览器里没有正式站的数据（要在平时做题的那个浏览器里打开镜像站）"};
  const pairs = src.map(k=>[k.slice(PROD_NS.length), localStorage.getItem(k)]);
  const r = replaceNamespace(pairs);
  if(!r.ok) return r;
  lsSet(NS+"_mirror", {copiedAt:Date.now(), keys:r.keys, chars:r.chars});
  r.profiles = Object.keys(users()).length;
  return r;
}
const mirrorInfo = ()=> lsGet(NS+"_mirror", null);

/* ---- 原样备份：这个命名空间下的全部东西（作答、错题、笔记、标记、划线、生词本、AI 对话、设置…）。
   「导出进度」只带作答/错题/笔记三样，换电脑会丢生词本和标记，这个不会。
   API key 一律抹掉；恢复时如果本机已经配了同一个供应商，沿用本机的 key。 */
function stripSecrets(tail, v){
  try{
    if(/:providers$/.test(tail)){ const a=JSON.parse(v); if(Array.isArray(a)){ a.forEach(p=>{ if(p) p.key=""; }); return JSON.stringify(a); } }
    if(/:settings$/.test(tail)){ const o=JSON.parse(v); if(o&&typeof o==="object"){ o.key=""; return JSON.stringify(o); } }
  }catch(e){}
  return v;
}
function rawBackup(){
  const data = {};
  nsKeys(NS).forEach(k=>{ const t=k.slice(NS.length); data[t] = stripSecrets(t, localStorage.getItem(k)); });
  return {_format:"band-seven-raw", _version:1, exportedAt:new Date().toISOString(), from:NS, data};
}
function exportRaw(){
  const b = rawBackup();
  saveFile("band-seven-原样备份-"+todayKey()+".json",
           new Blob([JSON.stringify(b)], {type:"application/json"}));
  toast(`已导出 ${Object.keys(b.data).length} 项（不含 API key）`);
}
function restoreRaw(d){
  if(!d || d._format!=="band-seven-raw" || !d.data || typeof d.data!=="object")
    return {ok:false, why:"这不是「原样备份」文件"};
  const pairs = Object.entries(d.data).filter(([t,v])=>
    typeof v==="string" && /^(_[\w-]+|:[^:]+:[\w-]+)$/.test(t));
  if(!pairs.length) return {ok:false, why:"备份里没有可用的数据"};
  // 本机已经配好的 API key 不能被备份里的空 key 冲掉
  const keep = {};
  nsKeys(NS).filter(k=>/:providers$/.test(k)).forEach(k=>{
    (lsGet(k, [])||[]).forEach(p=>{ if(p&&p.id&&p.key) keep[k.slice(NS.length)+"|"+p.id]=p.key; });
  });
  pairs.forEach(pr=>{
    if(!/:providers$/.test(pr[0])) return;
    try{ const a=JSON.parse(pr[1]);
      a.forEach(p=>{ if(p&&!p.key&&keep[pr[0]+"|"+p.id]) p.key=keep[pr[0]+"|"+p.id]; });
      pr[1]=JSON.stringify(a);
    }catch(e){}
  });
  return replaceNamespace(pairs);
}

  try{ const v=localStorage.getItem(k); return v==null? dflt : JSON.parse(v); }
  catch(e){ return dflt; }
}
let storageWarned = false;
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){
    if(!storageWarned){
      storageWarned = true;
      toast("浏览器存储已满，新记录没能保存 — 去设置里导出进度并清理");
    }
    return false;
  }
}

function snapReview(qid){          // 供「放弃不保存」回滚用，只记第一次
  if(!run || !run.prevReview) return;
  if(!(qid in run.prevReview)) run.prevReview[qid] = reviewQ[qid] ? JSON.parse(JSON.stringify(reviewQ[qid])) : null;
}
function collect(qid, why){
  snapReview(qid);
  const now = Date.now(), cur = reviewQ[qid];
  reviewQ[qid] = {box:1, due: now + BOX_DAYS[1]*DAY, adds:(cur&&cur.adds||0)+1, lastWhy: why||null, ts:now};
}
function gradeReview(qid, ok){
  const r = reviewQ[qid]; if(!r) return;
  snapReview(qid);
  if(ok){
    const nb = Math.min(5, (r.box||1)+1);
    if(nb>=5){ delete reviewQ[qid]; return; }
    r.box=nb; r.due = Date.now() + BOX_DAYS[nb]*DAY;
  }else{ r.box=1; r.due = Date.now() + BOX_DAYS[1]*DAY; }
}

function saveFile(filename, blob){

function importProgress(file, mode){
  const fr = new FileReader();
  fr.onload = ()=>{
    let d;
    try{ d = JSON.parse(fr.result); }catch(e){ return toast("文件不是合法的 JSON"); }
    if(!d || d._format!=="band-seven-progress") return toast("这不是本工具导出的进度文件");
    if(mode==="replace"){
      attempts = d.attempts||[]; reviewQ = d.review||{}; notesByQ = d.notes||{};
    }else{
      const seen = new Set(attempts.map(a=>a.aid));
      (d.attempts||[]).forEach(a=>{ if(!seen.has(a.aid)) attempts.push(a); });
      attempts.sort((a,b)=>(a.ts||0)-(b.ts||0));
      Object.entries(d.review||{}).forEach(([k,v])=>{
        if(!reviewQ[k] || v.due < reviewQ[k].due) reviewQ[k]=v;
      });
      Object.entries(d.notes||{}).forEach(([k,v])=>{ if(!notesByQ[k]) notesByQ[k]=v; });
    }
    if(d.settings){
      settings.pref  = d.settings.pref  || settings.pref;
      settings.fb    = d.settings.fb    || settings.fb;
      settings.model = d.settings.model || settings.model;
      saveSettings();
    }
    saveLocal(); lsSet(K("review"), reviewQ); lsSet(K("notes"), notesByQ);
    toast("已导入 "+attempts.length+" 条作答、"+Object.keys(reviewQ).length+" 道错题");
    render();
  };
  fr.readAsText(file);
}

/* ============ stats ============ */
function statsFor(filterFn){
  const rows = attempts.filter(filterFn);
  const n=rows.length, ok=rows.filter(r=>r.ok).length;
  const ms=rows.reduce((s,r)=>s+(r.ms||0),0);
  return {n, ok, acc:pct(ok,n), sec: n? Math.round(ms/n/1000):0};
}
/* 掌握度必须按「题」算，不能按「次」算。
   按次算有三个问题会把正确率压得偏低：
   1) 重做错题让同一道题反复计入，而重做的恰好都是你原本做错的题
   2) 模考里时间到没作答的题以 ok:false 入库，全被算成错
   3) 同一道题做对多次也重复计入，掩盖真实掌握程度
   现在：一道题只算一次，取最近一次作答；没作答的不计入。 */
function statsByQuestion(filterFn){
  const latest = new Map();
  let tries = 0;
  attempts.forEach(r=>{
    if(!filterFn(r)) return;
    tries++;
    if(r.picked==null || String(r.picked).trim()==="") return;
    const prev = latest.get(r.qid);
    if(!prev || (r.ts||0) >= (prev.ts||0)) latest.set(r.qid, r);
  });
  const rows = [...latest.values()];
  const n = rows.length, ok = rows.filter(r=>r.ok).length;
  const ms = rows.reduce((t,r)=>t+(r.ms||0),0);
  return {n, ok, acc:pct(ok,n), sec: n? Math.round(ms/n/1000):0, tries, rows};
}
const skillStats = (dom,sk)=> statsByQuestion(r=>r.dom===dom && r.sk===sk);
/* 一串 attempt -> 去重后的题目数组，最近做的排前面 */
function dedupQ(list){
  const seen=new Set(), out=[];
  list.slice().sort((a,b)=>b.ts-a.ts).forEach(a=>{
    if(seen.has(a.qid) || !BYID[a.qid]) return;
    seen.add(a.qid); out.push(BYID[a.qid]);
  });
  return out;
}

function skillBandStats(dom, sk){
  const by = {};
  statsByQuestion(a=>a.dom===dom && a.sk===sk).rows.forEach(a=>{
    const b=a.bd||0; (by[b]=by[b]||{n:0,ok:0}); by[b].n++; if(a.ok) by[b].ok++;
  });
  return by;
}
function worstBands(dom, sk){
  const by = skillBandStats(dom,sk);
  return Object.entries(by).filter(([b,s])=>s.n>=2 && s.ok/s.n < 0.7)
    .sort((a,b)=>(a[1].ok/a[1].n)-(b[1].ok/b[1].n))
    .map(([b,s])=>`band ${b}（${s.ok}/${s.n}）`);
}
function sampleQ(dom, sk){
  const pool = BANK.filter(q=>q.dom===dom && q.sk===sk && q.df==="M");
  const p2 = pool.length? pool : BANK.filter(q=>q.dom===dom && q.sk===sk);
  return p2[(Math.random()*p2.length)|0];
}

    group("先补这些", "做过 3 题以上、正确率不到 75%，按低到高排", weak);
    group("样本还太少", "做过但不到 3 题，先各做 10 道摸底", thin.slice(0,6));
    group("还没摸过底", "一题没做过，按题库题量排，先挑量大的", none.slice(0,6));
    if(!weak.length && !thin.length && !none.length)
      blk.appendChild(el("div","empty","目前每个做过的考点正确率都在 75% 以上。换到「按 domain」看全部考点。"));
    else if(none.length>6 || thin.length>6)
      blk.appendChild(el("div","hint",
        `还有 ${Math.max(0,none.length-6)+Math.max(0,thin.length-6)} 个考点没列出来，切到「按 domain」看全部 ${SKILLS.length} 个。`));
  }else if(groupBy==="domain"){
    DOM_ORDER.forEach(dom=>{
      const list = SKILLS.filter(s=>s.dom===dom);
      if(!list.length) return;
      const ds = statsByQuestion(r=>r.dom===dom);
      const h = el("div","skgroup");
      h.innerHTML = `<span class="dn">${esc(DOMAINS[dom].name)}</span>
        <span class="dm">${esc(DOMAINS[dom].cn)} · ${esc(DOMAINS[dom].share)}</span>
        <span class="dm" style="margin-left:auto">${ds.n? ds.acc+"% · "+ds.ok+"/"+ds.n : "还没做过"}</span>`;
      blk.appendChild(h);
      list.forEach(s=>blk.appendChild(skillCard(s)));
    });
  }else{
    [["rule","规则型"],["read","理解型"]].forEach(([kind,label])=>{
      const list = SKILLS.filter(s=>(SKILL_INFO[s.sk]||{}).kind===kind);
      if(!list.length) return;
      const kst = statsByQuestion(a=>(SKILL_INFO[a.sk]||{}).kind===kind);
      const rows = kst.rows, ok = kst.ok;
      const h = el("div","skgroup");
      h.innerHTML = `<span class="dn">${label}</span>
        <span class="dm">${esc(KIND[kind].d)} · ${list.length} 个考点</span>
        <span class="dm" style="margin-left:auto">${rows.length? kst.acc+"% · "+ok+"/"+rows.length : "还没做过"}</span>`;
      blk.appendChild(h);
      list.sort((a,b)=>b.total-a.total).forEach(s=>blk.appendChild(skillCard(s)));
    });
  }
  app.appendChild(blk);
}

function bandMeter(sec, title, curBand){
  const m = el("div","meter");
  const cur = curBand!=null ? BANDS[curBand-1] : null;
  const tgt = BANDS.find(b=> TARGET[sec]>=b.lo && (b.n===7 || TARGET[sec] < BANDS[b.n].lo));
  const st = statsByQuestion(r=>r.sec===sec && r.dom!=="ZZ");
  const hi = statsByQuestion(r=>r.sec===sec && r.dom!=="ZZ" && r.bd>= (sec===1?5:6));
  m.innerHTML = `<header><h3>${title}</h3>
    <span class="now num">${cur? `band ${cur.n}（${sec===1?cur.rw:cur.m}）→ 目标 ${TARGET[sec]}`
                               : "水平未设置"}</span></header>`;
  const bands = el("div","bands");
  BANDS.forEach(b=>{
    const on = cur ? b.n<=cur.n : false;
    const d = el("div","band"+(on?" on":"")+(cur&&b.n===cur.n?" cur":"")+(b.n===tgt.n?" tgt":""));
    d.style.background = `var(--b${b.n})`;
    d.innerHTML = `<span>${b.n}</span><span class="r">${sec===1?b.rw:b.m}</span>`;
    d.title = `Band ${b.n} · ${sec===1?b.rw:b.m}（Skills Insight, July 2026, Table 3）`;
    bands.appendChild(d);
  });
  m.appendChild(bands);
  if(!cur){
    const hint = el("div","hint");
    hint.style.marginTop="10px";
    hint.innerHTML = `还没有水平数据。<b>做一次完整模考</b>会自动评出来，也可以到「设置 → 账户与水平」自己指定。`;
    m.appendChild(hint);
  }
  const f = el("footer");
  f.innerHTML = `
    <div><b class="num">${st.n}</b><span>已做题</span></div>
    <div><b class="num">${st.acc==null?"—":st.acc+"%"}</b><span>总正确率</span></div>
    <div><b class="num">${hi.acc==null?"—":hi.acc+"%"}</b><span>band ${sec===1?"5–7":"6–7"} 正确率</span></div>`;
  m.appendChild(f);
  return m;
}

let cfg = {sec:1, doms:[], skills:[], bands:[], diffs:[], n:15, src:"fresh", timed:false};
function cfgFromLevel(){
  const lv = userLevel();
  const b = cfg.sec===1 ? lv.rw : lv.math;
  cfg.bands = b==null ? [] : [b, b+1, b+2].filter(x=>x>=1 && x<=7);  // 当前水平 + 往上两档
  return cfg.bands;
}

/* 题源：fresh 没做过的 / all 全部 / wrong 我做错过的 / marked 我标记过的 / wm 错过或标记过的。
   老配置只有 fresh 布尔值，这里向下兼容。 */
const SRC_OPTS = [
  {v:"fresh",  t:"没做过的", d:"跳过做过的题，优先新题"},
  {v:"all",    t:"全部",     d:"做没做过都抽"},
  {v:"wrong",  t:"我错过的", d:"只抽这个范围里你做错过、且没打「已掌握」的题"},
  {v:"marked", t:"我标记的", d:"只抽答题时按过「标记」的题"},
  {v:"wm",     t:"错的+标记",d:"错过的和标记过的合在一起"},
];
const srcOf = c => c.src || (c.fresh===false ? "all" : "fresh");
function pick(c){
  const src  = srcOf(c);
  const seen = new Set(attempts.map(a=>a.qid));
  const wrongIds = new Set(attempts.filter(a=>!a.ok).map(a=>a.qid));
  let pool = BANK.filter(q=>
    q.sec===c.sec &&
    (!c.doms.length   || c.doms.includes(q.dom)) &&
    (!c.skills.length || c.skills.includes(q.sk)) &&
    (!c.bands.length  || c.bands.includes(q.bd)) &&
    (!c.diffs.length  || c.diffs.includes(q.df)));
  if(src==="wrong")       pool = pool.filter(q=> wrongIds.has(q.id) && !mastered[q.id]);
  else if(src==="marked") pool = pool.filter(q=> marks[q.id]);
  else if(src==="wm")     pool = pool.filter(q=> marks[q.id] || (wrongIds.has(q.id) && !mastered[q.id]));
  else if(src==="fresh"){ const f = pool.filter(q=>!seen.has(q.id)); if(f.length >= Math.min(c.n,5)) pool=f; }
  for(let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0,c.n);
}
const poolSize = c => pick({...c, n:1e9}).length;

function builder(){
  const b = el("div","builder");
  const presets = el("div","presets");
  [
    {t:"按我的水平", s:"当前 band 往上两档（需先有水平数据）", c:"__level"},
    {t:"R&W 目标区间", s:"band 5–7 · 全部 4 个 domain", c:{sec:1,doms:[],skills:[],bands:[5,6,7],diffs:[],n:15}},
    {t:"证据与推断",   s:"Information and Ideas · band 5–7", c:{sec:1,doms:["INI"],skills:[],bands:[5,6,7],diffs:[],n:15}},
    {t:"语法规范",     s:"Standard English Conventions", c:{sec:1,doms:["SEC"],skills:[],bands:[],diffs:[],n:20}},
    {t:"Math 高分段",  s:"band 6–7 · 全部 4 个 domain", c:{sec:2,doms:[],skills:[],bands:[6,7],diffs:[],n:15}},
    {t:"进阶数学",     s:"Advanced Math · Hard", c:{sec:2,doms:["P"],skills:[],bands:[],diffs:["H"],n:15}},
  ].forEach(p=>{
    const btn = el("button","preset", `<b>${esc(p.t)}</b><span>${esc(p.s)}</span>`);
    btn.onclick = ()=>{
      if(p.c==="__level"){
        if(!levelSet()){ toast("还没有水平数据 —— 做一次完整模考，或去设置里自己指定"); return; }
        cfg.doms=[]; cfg.skills=[]; cfg.diffs=[]; cfgFromLevel();
      }
      else cfg={...cfg,...p.c,src:"fresh"};
      app_rebuildBuilder(b);
    };
    presets.appendChild(btn);
  });
  b.appendChild(presets);
  const fields = el("div","fields"); fields.id="bfields"; b.appendChild(fields);
  const foot = el("footer"); foot.id="bfoot"; b.appendChild(foot);
  app_rebuildBuilder(b);
  return b;
}

function app_rebuildBuilder(root){
  const fields = root.querySelector("#bfields"); fields.innerHTML="";
  const mk=(label,node)=>{const f=el("div","field"); f.appendChild(el("label",null,label)); f.appendChild(node); return f;};
  const chipRow=(items,sel,onTog)=>{
    const r=el("div","chips");
    items.forEach(it=>{
      const c=el("button","chip",esc(it.t));
      c.setAttribute("aria-pressed", sel.includes(it.v));
      c.onclick=()=>{ onTog(it.v); app_rebuildBuilder(root); };
      r.appendChild(c);
    });
    return r;
  };
  const tog=(arr,v)=> arr.includes(v)? arr.filter(x=>x!==v) : arr.concat([v]);

  fields.appendChild(mk("Section", chipRow(
    [{t:"Reading & Writing",v:1},{t:"Math",v:2}], [cfg.sec],
    v=>{ if(cfg.sec!==v){ cfg.sec=v; cfg.doms=[]; cfg.skills=[]; } })));

  const doms = DOM_ORDER.filter(d=>DOMAINS[d].sec===cfg.sec).map(d=>({t:DOMAINS[d].name,v:d}));
  fields.appendChild(mk("Domain", chipRow(doms, cfg.doms, v=>{ cfg.doms=tog(cfg.doms,v); cfg.skills=[]; })));

  const skillOpts = SKILLS.filter(s=>s.sec===cfg.sec && (!cfg.doms.length||cfg.doms.includes(s.dom)));
  const sel = el("select");
  sel.innerHTML = `<option value="">全部考点（${skillOpts.length}）</option>` +
    skillOpts.map(s=>`<option value="${esc(s.sk)}" ${cfg.skills.includes(s.sk)?"selected":""}>${esc(s.sk)} (${s.total})</option>`).join("");
  sel.onchange = ()=>{ cfg.skills = sel.value? [sel.value] : []; app_rebuildBuilder(root); };
  fields.appendChild(mk("考点", sel));

  const dField = mk("难度", chipRow(
    [{t:"Easy",v:"E"},{t:"Medium",v:"M"},{t:"Hard",v:"H"}], cfg.diffs, v=>{cfg.diffs=tog(cfg.diffs,v);}));
  dField.appendChild(el("div","hint", cfg.diffs.length
    ? `只出 ${cfg.diffs.map(d=>DIFF[d]).join(" / ")}。`
    : "一个都不选 = 三档混合随机抽，比例跟题库一致。想专攻某一档就点亮它。"));
  fields.appendChild(dField);

  const nIn = el("input"); nIn.type="number"; nIn.min=5; nIn.max=60; nIn.value=cfg.n;
  nIn.onchange=()=>{ cfg.n=Math.max(1,Math.min(60,+nIn.value||15)); app_rebuildBuilder(root); };
  const opts = el("div","field");
  opts.appendChild(el("label",null,"选项"));
  const t2=el("label","toggle"); const c2=el("input"); c2.type="checkbox"; c2.checked=cfg.timed;
  c2.onchange=()=>{cfg.timed=c2.checked;};
  t2.appendChild(c2); t2.appendChild(document.createTextNode("计时（整组倒计时）"));
  t2.title = "打开：按官方配速给整组题一个总时限，到点自动交卷。关闭：只累计用时，不限时。";
  opts.appendChild(t2);
  fields.appendChild(mk("题量", nIn));
  fields.appendChild(opts);

  if(cfg.src==null) cfg.src = cfg.fresh===false ? "all" : "fresh";
  const fSrc = mk("题源", chipRow(SRC_OPTS.map(o=>({t:o.t, v:o.v})), [cfg.src], v=>{ cfg.src=v; }));
  fSrc.querySelectorAll(".chip").forEach((b,i)=>{ b.title = SRC_OPTS[i].d; });
  fSrc.appendChild(el("div","hint", (SRC_OPTS.find(o=>o.v===cfg.src)||SRC_OPTS[0]).d +
    "。「我错过的」「我标记的」就是把错题本和标记里符合上面筛选条件的题直接排成一组。"));
  fields.appendChild(fSrc);

  const fRev = el("div","field");
  fRev.appendChild(el("label",null,"答案时机"));
  const rrow = el("div","chips");
  [["end","做完再出"],["now","交一题出一题"]].forEach(([k,t])=>{
    const b=el("button","chip",t);
    b.setAttribute("aria-pressed",(settings.reveal||"end")===k);
    b.onclick=()=>{ settings.reveal=k; saveSettings(); app_rebuildBuilder(root); };
    rrow.appendChild(b);
  });
  fRev.appendChild(rrow);
  fRev.appendChild(el("div","hint", (settings.reveal==="now")
    ? "提交一题立刻出答案，看解析时计时停表。"
    : "整组做完才统一判分，中途可自由改答案。开始后不能中途查看答案。"));
  fields.appendChild(fRev);

  const avail = poolSize(cfg);
  const foot = root.querySelector("#bfoot"); foot.innerHTML="";
  foot.appendChild(el("span","avail", `符合条件 <b>${avail}</b> 题 · 本次抽取 ${Math.min(avail,cfg.n)} 题`));
  const look = el("button","ghost","只看不做");
  look.disabled = avail===0;
  look.onclick = ()=>{ const qs=pick(cfg); if(!qs.length) return toast("没有符合条件的题");
    openBrowse(qs, cfg.skills[0] || (cfg.sec===1?"Reading & Writing":"Math")); };
  foot.appendChild(look);
  const go = el("button","primary","开始练习");
  go.disabled = avail===0;

  };
  foot.appendChild(go);

/* ============ 学习时长 ============ */
let sessions = [];
let marks = {};      // qid -> {ts, sk, dom}  跨会话保留的标记
let vocab = [];      // 生词本
let mastered = {};   // qid -> ts  错题本里打过对号的
let rx = [];         // AI 开出的推荐练习
const minutesOf = ms => Math.round(ms/60000);
function logSession(rec){
  sessions.push(rec);
  lsSet(K("sessions"), sessions.slice(-1200));
}
function timeStats(){
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const weekStart = dayStart - ((now.getDay()+6)%7)*DAY;     // 周一为一周之始
  const sum = f => sessions.filter(f).reduce((s,r)=>s+(r.activeMs||0),0);
  return {
    today: sum(r=>r.endTs>=dayStart),
    week:  sum(r=>r.endTs>=weekStart),
    all:   sum(()=>true),
    days:  new Set(sessions.map(r=>new Date(r.endTs).toISOString().slice(0,10))).size
  };
}

/* ============ 模考 ============
   结构取自 College Board 官方规格：
   R&W 两个模块各 27 题 / 32 分钟；Math 两个模块各 22 题 / 35 分钟；两个 section 之间休息 10 分钟。
   第二模块难度由第一模块表现决定（自适应路由）。 */
const MOCK = {
  1: {mods:2, perMod:27, minutes:32, name:"Reading and Writing",
      mix:{CAS:8, INI:7, SEC:7, EOI:5}, order:["CAS","INI","SEC","EOI"]},
  2: {mods:2, perMod:22, minutes:35, name:"Math",
      mix:{H:8, P:8, Q:3, S:3}, order:["H","P","Q","S"]}
};
const ROUTE_CUT = 0.6;   // 第一模块正确率达到这个值就路由到难模块

function drawMix(sec, bands, diffs, used){
  const cfgm = MOCK[sec], out = [];
  cfgm.order.forEach(dom=>{
    let pool = BANK.filter(q=> q.sec===sec && q.dom===dom && !used.has(q.id)
      && (!bands.length || bands.includes(q.bd))
      && (!diffs.length || diffs.includes(q.df)));
    if(pool.length < cfgm.mix[dom]) {                       // 条件太窄就放宽难度限制
      pool = BANK.filter(q=> q.sec===sec && q.dom===dom && !used.has(q.id));
    }
    for(let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const take = pool.slice(0, cfgm.mix[dom]);
    // 每个 domain 内部由易到难，和真考一致
    const rank = {E:0, M:1, H:2};
    take.sort((a,b)=> (rank[a.df]??1)-(rank[b.df]??1) || (a.bd||0)-(b.bd||0));
    take.forEach(q=>used.add(q.id));
    out.push(...take);
  });
  return out;
}

function buildStage(sec, which, used){
  const easyBands = [1,2,3,4], hardBands = [4,5,6,7];
  const b = which==="M1" ? [2,3,4,5] : (which==="hard" ? hardBands : easyBands);
  const d = which==="M1" ? [] : (which==="hard" ? ["M","H"] : ["E","M"]);
  return {
    sec, which,
    label: MOCK[sec].name + (which==="M1" ? " · 模块 1" : " · 模块 2" + (which==="hard"?"（难）":"（易）")),
    minutes: MOCK[sec].minutes,
    qs: drawMix(sec, b, d, used)
  };
}

function startMock(kind){
  const used = new Set();
  const secs = kind==="full" ? [1,2] : [kind];
  const plan = {kind, secs, used, stages:[], si:0, results:[], startTs:Date.now(),
                sid:"s"+Date.now().toString(36)+"m"};
  plan.stages.push(buildStage(secs[0], "M1", used));
  mockPlan = plan;
  beginStage();
}
let mockPlan = null;

function beginStage(){
  const st = mockPlan.stages[mockPlan.si];
  sessionAnalysis = "";
  run = {
    qs: st.qs, i:0, label: st.label, timed:true, finished:false, review:false,
    blind:true, mock:true, stage:st,
    deadline: Date.now() + st.minutes*60000,
    state: st.qs.map(()=>({picked:null, sub:false, ok:null, ms:0, marked:false, struck:[], aid:null, why:null})),
    written:[], prevReview:{},
    sid: (mockPlan && mockPlan.sid) || ("s"+Date.now().toString(36)),
    t0: Date.now(), total0: Date.now(), pausedTotal:0
  };
  $("#view-run").classList.remove("hide");
  document.body.style.overflow="hidden";
  drawRun();
  tick();
}

function finishStage(){
  const st = mockPlan.stages[mockPlan.si];
  let ok=0;
  run.state.forEach((s,k)=>{
    const q = run.qs[k];
    const got = s.picked!=null && (q.ty==="spr" ? sprMatch(s.picked,q.an) : q.an.includes(s.picked));
    s.ok = !!got; s.sub = true;
    if(got) ok++;
  });
  mockPlan.results.push({stage:st, ok, n:st.qs.length, state:run.state, qs:run.qs});
  clearInterval(run._t);

  // 路由 / 下一阶段
  if(st.which==="M1"){
    const route = (ok/st.qs.length) >= ROUTE_CUT ? "hard" : "easy";
    mockPlan.stages.push(buildStage(st.sec, route, mockPlan.used));
    mockPlan.si++;
    return drawTransition(`${MOCK[st.sec].name} 模块 1 结束`,
      `第一模块 ${ok} / ${st.qs.length} 正确。按真考规则，第二模块路由到<b>${route==="hard"?"较难":"较易"}</b>那一组。`,
      "开始模块 2", beginStage);
  }
  // section 结束
  const nextSecIdx = mockPlan.secs.indexOf(st.sec)+1;
  if(nextSecIdx < mockPlan.secs.length){
    const nx = mockPlan.secs[nextSecIdx];
    mockPlan.stages.push(buildStage(nx, "M1", mockPlan.used));
    mockPlan.si++;
    return drawBreak(10, ()=>beginStage());
  }
  drawMockReport();
}

function drawTransition(title, html, btnText, next){

function drawBreak(minutes, next){
  const root=$("#view-run"); root.innerHTML="";

      <div class="bigtimer num" id="brk">10:00</div></div>`;

    e.textContent = String((left/60)|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
    if(left<=0){ clearInterval(t); next(); }

/* ============ practice run ============ */
function autoLabel(qs, base){
  const d = new Date(), p=n=>String(n).padStart(2,"0");
  const when = `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
  let what = base;
  if(!what){
    const sks = [...new Set(qs.map(q=>q.sk))];
    const secs = [...new Set(qs.map(q=>q.sec))];
    what = sks.length===1 ? sks[0]
         : secs.length===1 ? (secs[0]===1?"Reading & Writing":"Math")
         : "混合";
  }
  return `${when} · ${what} · ${qs.length}题`;
}
function startRun(qs, opt){
  if(!qs || !qs.length){ toast("没有符合条件的题"); return; }
  sessionAnalysis = "";
  opt = Object.assign({}, opt);
  opt.label = autoLabel(qs, opt.label);
  const blind = opt.blind!=null ? opt.blind : (settings.reveal!=="now");
  // 勾了「计时」= 按官方配速给整组一个总时限（R&W 71 秒/题、Math 95 秒/题），到点自动交卷。
  // 不勾 = 只累计用时，不催。原来 run.timed 只被赋值、没有任何地方读它，等于开关是死的。
  const PACE_S = {1:71, 2:95};
  const budgetMs = opt.timed===true
    ? qs.reduce((t,q)=>t + (PACE_S[q.sec]||71), 0) * 1000
    : 0;
  run = { qs, i:0, label:opt.label, timed:opt.timed===true, finished:false, review:!!opt.review, blind,
          deadline: budgetMs ? Date.now()+budgetMs : null, budgetMs,
          written:[], prevReview:{},
          sid: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
          state: qs.map(()=>({picked:null, sub:false, ok:null, ms:0, marked:false, struck:[], aid:null, why:null})),
          t0: Date.now(), total0: Date.now() };
  $("#view-run").classList.remove("hide");
  document.body.style.overflow="hidden";
  try{ history.pushState({v:view, run:1}, "", "#run"); }catch(e){}
  drawRun();
  tick();
}
async function gradeAll(){
  for(let k=0;k<run.qs.length;k++){
    const q=run.qs[k], st=run.state[k];
    if(st.sub) continue;
    if(st.picked==null || String(st.picked).trim()===""){ st.sub=true; st.ok=false; continue; }  // 没作答：不入库
    st.ok = q.ty==="spr" ? sprMatch(st.picked,q.an) : q.an.includes(st.picked);
    st.sub = true;
    st.aid = q.id+"-"+Date.now().toString(36)+"-"+k;
    run.written.push(st.aid);
    await recordAttempt({aid:st.aid, qid:q.id, eid:q.eid, sec:q.sec, dom:q.dom, sk:q.sk,
      df:q.df, bd:q.bd, ty:q.ty, picked:st.picked, correct:q.an.join("|"), ok:st.ok,
      ms:st.ms, why:null, ts:Date.now(), session:run.label, sid:run.sid, review:!!run.review});
    if(run.review && reviewQ[q.id]) gradeReview(q.id, st.ok);
    else if(!st.ok) collect(q.id, null);
  }
  await flushReview();
}
async function endRun(){
  if(run.finished) return;
  saveTime();
  if(run.mock){ run.finished=true; return finishStage(); }
  if(run.blind) await gradeAll();
  run.finished = true;
  clearInterval(run._t);
  const done = run.state.filter(s=>s.sub);
  const ok = done.filter(s=>s.ok).length;
  const activeMs = run.state.reduce((t,s)=>t+(s.ms||0),0);
  const secs = Math.round(activeMs/1000);
  const answered = run.state.filter(s=>s.picked!=null && String(s.picked).trim()!=="").length;
  if(answered) logSession({sid:run.sid, label:run.label, mode:"drill", startTs:run.total0,
                           endTs:Date.now(), activeMs, n:answered, ok,
                           marked: run.qs.filter(q=>marks[q.id]).length,
                           qids: run.qs.map(q=>q.id)});   // 一题没做就不记这一场
  drawSummary(done.length, ok, secs);
}
/* 中途放弃这一场：把这次写进去的作答和错题集改动撤回。
   划的重点、标记、生词本是独立的收藏，保留不动。 */
async function cancelRun(){
  if(!run) return;
  const answered = run.state.filter(s=>s.picked!=null && String(s.picked).trim()!=="").length;
  const wrote = (run.written||[]).length;
  const msg = run.mock
    ? "放弃这次模考？已答的部分不会留下任何记录。"
    : (wrote
        ? `放弃这一场？已判分的 ${wrote} 题会从作答记录里删掉，这次新进错题集的题也会撤回。\n（划的重点、标记和生词本保留。）`
        : `放弃这一场？${answered? "已选的 "+answered+" 题":"这次"}不会计入任何记录。\n（划的重点、标记和生词本保留。）`);
  if(!confirm(msg)) return;

  if(wrote){
    const kill = new Set(run.written);
    attempts = attempts.filter(a=>!kill.has(a.aid));
    saveLocal();
  }
  const prev = run.prevReview || {};
  Object.keys(prev).forEach(qid=>{
    if(prev[qid]===null) delete reviewQ[qid];
    else reviewQ[qid] = prev[qid];
  });
  if(Object.keys(prev).length) await flushReview();

  run.finished = true;
  if(run._t) clearInterval(run._t);
  run = null; mockPlan = null;
  $("#view-run").classList.add("hide"); $("#view-run").innerHTML="";
  document.body.style.overflow="";
  toast("已放弃，没有留下记录");
  render();
}

function closeRun(){
  redrawOverlay = null;
  if(run && run._t) clearInterval(run._t);
  run=null;
  $("#view-run").classList.add("hide"); $("#view-run").innerHTML="";
  document.body.style.overflow="";
  render();
}

function pauseRun(){
  if(!run || run.paused || run.finished) return;
  saveTime();                       // 把当前题已用时间结算掉，暂停期间不计时
  run.paused = true;
  run.pauseStart = Date.now();
  drawRun();
}
function resumeRun(){
  if(!run || !run.paused) return;
  const gap = Date.now() - run.pauseStart;
  run.pausedTotal = (run.pausedTotal||0) + gap;
  if(run.deadline) run.deadline += gap;
  run.paused = false;
  run.t0 = Date.now();
  drawRun();
}

const mmss = s => String((s/60)|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tick(){
  run._t = setInterval(()=>{
    if(!run || run.paused) return;
    const tq = $("#tq"), tt2 = $("#tt");
    if(tq){                                   // 普通练习：本题用时 + 全组总用时
      const st = run.state[run.i];
      if(run.frozen){
        tq.textContent = mmss(Math.round((st.ms||0)/1000));
        tq.classList.add("froz");
        const lb = tq.parentElement.querySelector(".lab");
        if(lb) lb.textContent = "看解析·停表";
        return;
      }
      const lb0 = tq.parentElement.querySelector(".lab");
      if(lb0 && lb0.textContent!=="本题") lb0.textContent = "本题";
      tq.classList.remove("froz");
      const cur = Math.round((Date.now()-run.t0)/1000) + Math.round((st.ms||0)/1000);
      tq.textContent = mmss(cur);
      const cap = run.qs[run.i].sec===1 ? 71 : 95;   // R&W 32min/27题≈71s，Math 35min/22题≈95s
      tq.classList.toggle("warn", cur>cap);
      if(tt2){
        const other = run.state.reduce((a,x,k)=> a + (k===run.i?0:(x.ms||0)), 0);
        tt2.textContent = mmss(Math.round(other/1000) + cur);
      }
      return;
    }
    const t = $("#timer"); if(!t) return;
    if(run.deadline){
      const left = Math.max(0, Math.round((run.deadline-Date.now())/1000));
      t.textContent = String((left/60)|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
      t.classList.toggle("warn", left<=300);        // 最后 5 分钟提醒
      if(left<=0){
        clearInterval(run._t); saveTime();
        if(run.mock) finishStage(); else { toast("时间到"); endRun(); }
      }
      return;
    }
  },500);
}

      fb.textContent = !st.picked ? `最多 ${lim} 个字符`
        : f.ok ? `${st.picked.length}/${lim} 个字符，格式可以`
               : f.why;
      const sb=$("#submitbtn"); if(sb) sb.disabled = !st.picked || !f.ok;
    };
    inp.oninput = sync;
    inp.onkeydown = e=>{ if(e.key==="Enter" && !run.mock && !st.sub && sprFormat(inp.value.trim()).ok) submit(); };
    box.appendChild(inp);
    box.appendChild(fb);
    if(!st.sub){
      box.appendChild(sprKeypad(()=>inp.value, v=>{ inp.value=v; sync(); inp.focus(); }));
      box.appendChild(el("div","hint",
        "官方规则：正数最多 5 个字符，负数 6 个（含负号）。分数写成 7/2，带分数不接受。" +
        "小数填不下时在第 4 位截断或四舍五入（例如 2/3 填 .6666 或 .6667，填 .66 不算对）。" +
        "不能填逗号、百分号、美元符号。<b>答案永远是数字——π 和根号要换算成小数填。</b>"));
    }
    ri.appendChild(box);
    setTimeout(sync, 0);
  }else{
    const wrap = el("div","opts");
    q.op.forEach((o,k)=>{
      const L = "ABCD"[k];
      const b = el("button","opt");
      b.innerHTML = `<span class="ltr">${L}</span><span class="oc qtext">${o}</span>`;
      b.setAttribute("aria-pressed", st.picked===L);
      if(st.struck.includes(L)) b.classList.add("struck");
      if(st.sub){
        b.disabled = true;
        if(q.an.includes(L)) b.classList.add("correct");
        else if(st.picked===L) b.classList.add("chosen-wrong");
      }else{
        b.onclick = ()=>{ st.picked=L; drawRun(); };
        b.oncontextmenu = e=>{ e.preventDefault();
          st.struck = st.struck.includes(L)? st.struck.filter(x=>x!==L) : st.struck.concat([L]);
          drawRun(); };
      }
      wrap.appendChild(b);
    });
    ri.appendChild(wrap);
    if(!st.sub) ri.appendChild(el("div","sprbox",'<div class="hint">右键选项可划掉排除项</div>'));
  }

  if(st.sub) drawReview(ri, q, st);
  applyHighlights(root, q.id);
  applyScale();

  // footer
  const foot = el("div","runfoot");
  const dots = el("div","navdots");
  run.state.forEach((s,k)=>{
    const isMarked = !!marks[run.qs[k].id];
    const dd = el("button","dot"+(s.sub?(s.ok?" ok":" no"):(s.picked?" done":""))+(k===run.i?" cur":"")+(isMarked?" marked":""), String(k+1));
    dd.style.position="relative";
    dd.onclick=()=>{ saveTime(); unfreeze(); run.i=k; drawRun(); };
    dots.appendChild(dd);
  });
  foot.appendChild(dots);
  foot.appendChild(el("div","spacer"));
  const prev = el("button","ghost","上一题");
  prev.disabled = run.i===0;
  prev.onclick=()=>{ saveTime(); unfreeze(); run.i--; drawRun(); };
  foot.appendChild(prev);
  if(run.mock || run.blind){
    const last = run.i===run.qs.length-1;
    const nb = el("button","primary", last ? (run.mock?"交卷":"交卷看结果") : "下一题");
    nb.onclick=()=>{
      saveTime(); unfreeze();
      if(last){
        if(run.mock){ if(confirm("确定交卷？本模块不能再回来改。")) finishStage(); }
        else endRun();
      }else{ run.i++; drawRun(); }
    };
    foot.appendChild(nb);
  }else if(!st.sub){
    const sb = el("button","primary","提交"); sb.id="submitbtn";
    sb.disabled = !st.picked; sb.onclick=submit;
    foot.appendChild(sb);
  }else{
    const nb = el("button","primary", run.i===run.qs.length-1? "完成":"下一题");
    nb.onclick=()=>{
      saveTime(); unfreeze();
      if(run.i===run.qs.length-1) endRun();
      else { run.i++; drawRun(); }
    };
    foot.appendChild(nb);
  }
  root.appendChild(foot);
}

function saveTime(){
  if(run.frozen) return;                       // 看解析的时间不计入答题用时
  const st=run.state[run.i]; st.ms += Date.now()-run.t0;
}
function unfreeze(){ run.frozen=false; run.t0=Date.now(); }

/* ============ 计算器 ============
   官方政策（Digital SAT Specifications Overview 原文）：
   "Calculators are allowed throughout the Math section. A single Math section replaces the
    separately timed no-calculator and calculator-allowed portions of the paper and pencil test."
   所以数字 SAT 的 Math 全程可用计算器，不存在「这道题不许用」的题；R&W 不提供。
   真考用的是内置 Desmos。这里是自带的科学计算器（无第三方依赖），
   想练真家伙请用官方的 desmos.com/testing/cb-sat-ap/graphing。 */
let calcOpen = false, calcExpr = "", calcAns = "", calcErr = "";

function calcEval(src){
  let s = String(src).replace(/×/g,"*").replace(/÷/g,"/").replace(/[−–—]/g,"-")
                     .replace(/π/g,"PI").replace(/√/g,"sqrt");
  if(!/^[0-9+\-*/^().,%\sA-Za-z]*$/.test(s)) throw new Error("含不支持的字符");
  // 只认白名单里的名字，一次扫描替换完 —— 先 ln→Math.log 再 log→Math.log10 会把自己的结果
  // 又改一遍（"Math.log(" 里的 "log(" 前面是 "."，\b 照样匹配），ln 因此一直是坏的。
  const FN = {sqrt:"Math.sqrt", abs:"Math.abs", sin:"Math.sin", cos:"Math.cos", tan:"Math.tan",
              asin:"Math.asin", acos:"Math.acos", atan:"Math.atan", exp:"Math.exp",
              pow:"Math.pow", min:"Math.min", max:"Math.max", round:"Math.round",
              floor:"Math.floor", ceil:"Math.ceil", ln:"Math.log", log:"Math.log10",
              PI:"Math.PI", E:"Math.E"};
  const has = n => Object.prototype.hasOwnProperty.call(FN, n);
  for(const nm of (s.match(/[A-Za-z]+/g) || [])) if(!has(nm)) throw new Error("不支持 " + nm);
  // 百分号：直接换成 /100。原来的 /(\d)\s*%/ 只吃最后一位数字，"50%" 会变成 "5(0/100)" 然后报错。
  s = s.replace(/%/g, "/100");
  // 隐式乘法：2(3+1)、3π、(2)(3) —— 真计算器都认
  s = s.replace(/(\d|\))\s*(?=[A-Za-z(])/g, "$1*").replace(/(\))\s*(?=\d)/g, "$1*");
  s = s.replace(/\^/g, "**").replace(/[A-Za-z]+/g, m=>FN[m]);
  const v = Function('"use strict";return (' + s + ')')();
  if(typeof v!=="number" || !isFinite(v)) throw new Error("结果不是有限数");
  return v;
}

/* 面板是每次按键重绘的，所以这几个动作放在模块级 —— 键盘和按钮走同一套逻辑。 */
function calcRefresh(){
  const old = document.querySelector(".calcpanel");
  if(old) old.replaceWith(calcPanel());
}
function calcLive(){
  if(!calcExpr.trim()){ calcAns=""; calcErr=""; return calcRefresh(); }
  try{ calcAns = String(+calcEval(calcExpr).toPrecision(12)); calcErr=""; }
  catch(e){ calcAns=""; }          // 边打边算，没算成就先不报错
  calcRefresh();
}
function calcPut(v){ calcExpr += v; calcErr=""; calcLive(); }
function calcAct(a){
  if(a==="ac"){ calcExpr=""; calcAns=""; calcErr=""; calcRefresh(); }
  else if(a==="del"){ calcExpr=calcExpr.slice(0,-1); calcLive(); }
  else if(a==="eq"){
    try{ calcAns=String(+calcEval(calcExpr).toPrecision(12)); calcErr=""; }
    catch(e){ calcErr=e.message; calcAns=""; }
    calcRefresh();
  }
}
/* 计算器开着时键盘归计算器 —— 否则按 1234 会去选 ABCD，打不了数。
   返回 true 表示这个键被计算器吃掉了。 */
function calcKeydown(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return false;
  const k = e.key;
  if(/^[0-9]$/.test(k))        { calcPut(k); return true; }
  if(k==="." || k===",")       { calcPut("."); return true; }
  if(k==="+")                  { calcPut("+"); return true; }
  if(k==="-")                  { calcPut("−"); return true; }
  if(k==="*" || k==="x" || k==="X"){ calcPut("×"); return true; }
  if(k==="/")                  { calcPut("÷"); return true; }
  if(k==="^")                  { calcPut("^"); return true; }
  if(k==="(" || k===")" || k==="%"){ calcPut(k); return true; }
  if(k==="Backspace")          { calcAct("del"); return true; }
  if(k==="Enter" || k==="=")   { calcAct("eq"); return true; }
  if(k==="Delete" || k==="c" || k==="C"){ calcAct("ac"); return true; }
  if(k==="Escape")             { calcOpen=false; drawRun(); return true; }
  return false;
}

  const head = el("div","calchead");

  const link = el("a","calclink","官方 Desmos ↗");

  link.target = "_blank"; link.rel = "noopener";

  head.appendChild(link);

  x.onclick=()=>{ calcOpen=false; drawRun(); };

  const scr = el("div","calcscreen");
  scr.innerHTML = `<div class="cexpr">${esc(calcExpr)||"&nbsp;"}</div>
    <div class="cans ${calcErr?"err":""}">${calcErr? esc(calcErr) : (calcAns===""?"&nbsp;":esc(calcAns))}</div>`;
  p.appendChild(scr);

  // 键位照实体计算器 / Windows 计算器排：右边一列自上而下 ÷ × − +，÷ 在 789 那一行的上面。
  // 之前 ÷ 占了 789 这一行、× 占 456，手感上正好错位一行，按惯性就按错。
  const rows = [
    [{t:"sin",v:"sin("},{t:"cos",v:"cos("},{t:"tan",v:"tan("},{t:"ln",v:"ln("},{t:"log",v:"log("}],
    [{t:"AC",act:"ac",cls:"fn"},{t:"⌫",act:"del",cls:"fn"},{t:"(",v:"("},{t:")",v:")"},{t:"÷",v:"÷",cls:"op"}],
    [{t:"7",v:"7"},{t:"8",v:"8"},{t:"9",v:"9"},{t:"x²",v:"^2"},{t:"×",v:"×",cls:"op"}],
    [{t:"4",v:"4"},{t:"5",v:"5"},{t:"6",v:"6"},{t:"√",v:"√("},{t:"−",v:"−",cls:"op"}],
    [{t:"1",v:"1"},{t:"2",v:"2"},{t:"3",v:"3"},{t:"xʸ",v:"^"},{t:"+",v:"+",cls:"op"}],
    [{t:"0",v:"0"},{t:".",v:"."},{t:"%",v:"%"},{t:"π",v:"π"},{t:"=",act:"eq",cls:"eq"}],
  ];
  const pad = el("div","calcpad");
  rows.forEach(r=>{
    const rr = el("div","calcrow");
    r.forEach(k=>{
      const b = el("button","calckey"+(k.cls?" "+k.cls:""), k.t);
      b.onclick=()=> k.act? calcAct(k.act) : calcPut(k.v);
      rr.appendChild(b);
    });
    pad.appendChild(rr);
  });
  p.appendChild(pad);
  p.appendChild(el("div","calcnote",
    "键盘可以直接打：数字、<b>+ − * /</b>、括号、^、Enter 算、Backspace 退格、C 清空、Esc 收起。"+
    "计算器开着的时候键盘归它，不会误选 ABCD。<br>"+
    "数字 SAT 的 Math 全程允许用计算器。真考内置 Desmos，点右上角可以打开官方版练手。"));
  return p;
}

/* ============ 填空题（student-produced response）============
   规则原文取自官方 Bluebook 考试指令
   （satsuite.collegeboard.org/media/pdf/english-sat-test-directions-bb.pdf）：
   · 找到多个正确答案时只填一个
   · 正数最多 5 个字符，负数最多 6 个（含负号）
   · 分数填不下就填小数
   · 小数填不下就在第 4 位截断或四舍五入
   · 带分数（如 3½）要写成假分数 7/2 或小数 3.5
   · 不要填百分号、逗号、美元符号
   官方接受表（这就是「必须占满位数」的依据）：
     3.5 → 3.5 / 3.50 / 7/2 可以；31/2、3 1/2 不行
     ⅔  → 2/3 / .6666 / .6667 / 0.666 / 0.667 可以；0.66、.66、0.67、.67 不行
     -⅓ → -1/3 / -.3333 / -0.333 可以；-.33、-0.33 不行 */

const SPR_CHARS = v => (String(v).trim().startsWith("-") ? 6 : 5);

function sprValue(s){
  s = String(s).trim().replace(/\s+/g,"").replace(/[–—−]/g,"-");
  if(!s) return null;
  const f = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if(f){ const b=parseFloat(f[2]); if(!b) return null; return parseFloat(f[1])/b; }
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  return null;
}
/* 输入合法性：只判形式，不判对错 */
function sprFormat(s){
  const t = String(s||"").trim();
  if(!t) return {ok:false, why:""};
  if(/[,%$]/.test(t)) return {ok:false, why:"不能填逗号、百分号或美元符号"};
  if(/\s/.test(t.replace(/^\s+|\s+$/g,""))) return {ok:false, why:"带分数要写成假分数（7/2）或小数（3.5）"};
  if(!/^-?(\d+\.?\d*|\.\d+)(\/-?(\d+\.?\d*|\.\d+))?$/.test(t))
    return {ok:false, why:"只能填数字、小数点、斜杠和负号"};
  const lim = SPR_CHARS(t);
  if(t.length > lim) return {ok:false, why:`${t.startsWith("-")?"负数":"正数"}最多 ${lim} 个字符${t.startsWith("-")?"（含负号）":""}`};
  if(sprValue(t)===null) return {ok:false, why:"这个写法解析不出数值"};
  return {ok:true, why:""};
}

/* 判对：按官方规则，而不是简单的数值容差 */
function sprMatch(input, keys){
  const t = String(input||"").trim().replace(/[–—−]/g,"-");
  if(!t || !sprFormat(t).ok) return false;
  const norm = x => String(x).trim().replace(/[–—−]/g,"-").replace(/\s+/g,"");
  for(const k of keys){
    const kk = norm(k);
    if(norm(t) === kk) return true;                       // 和答案键一字不差
    const V = sprValue(kk);
    if(V===null) continue;
    const mine = sprValue(t);
    if(mine===null) continue;

    if(t.includes("/")){                                   // 分数：等值即可
      if(Math.abs(mine - V) < 1e-9) return true;
      continue;
    }
    // 小数：必须等于真值在某一位上的截断或四舍五入，
    // 且「占满字符预算」或「本身就是有限小数且完全相等」
    const dot = t.indexOf(".");
    const dec = dot<0 ? 0 : t.length - dot - 1;
    const p = Math.pow(10, dec);
    const trunc = (V<0 ? Math.ceil(V*p) : Math.floor(V*p)) / p;
    const round = Math.round(V*p) / p;
    const hits = Math.abs(mine-trunc) < 1e-12 || Math.abs(mine-round) < 1e-12;
    if(!hits) continue;
    const exact = Math.abs(mine - V) < 1e-12;              // 有限小数写全了
    const full  = t.length >= SPR_CHARS(t);                // 占满了输入格
    if(exact || full) return true;
  }
  return false;
}

/* 官方式输入键盘：手机上打不出 / 和 - 的问题一并解决 */
function sprKeypad(getVal, setVal){
  const pad = el("div","sprpad");
  const row = (keys)=>{
    const r = el("div","sprrow");
    keys.forEach(k=>{
      const b = el("button","sprkey"+(k.cls?" "+k.cls:""), k.t);
      b.type="button";
      b.title = k.title||"";
      b.onclick = ()=>{
        let v = getVal();
        if(k.act==="del") v = v.slice(0,-1);
        else if(k.act==="clr") v = "";
        else if(k.act==="neg") v = v.startsWith("-") ? v.slice(1) : "-"+v;
        else v = v + k.v;
        setVal(v);
      };
      r.appendChild(b);
    });
    return r;
  };
  const d = n=>({t:String(n), v:String(n)});
  pad.appendChild(row([d(7),d(8),d(9),{t:"⌫",act:"del",cls:"fn",title:"退一格"}]));
  pad.appendChild(row([d(4),d(5),d(6),{t:"清空",act:"clr",cls:"fn"}]));
  pad.appendChild(row([d(1),d(2),d(3),{t:"／",v:"/",cls:"op",title:"分数线，例如 7/2"}]));
  pad.appendChild(row([d(0),{t:".",v:".",cls:"op"},{t:"−",act:"neg",cls:"op",title:"切换正负号"},
                       {t:"",cls:"blankkey"}]));
  return pad;
}

async function submit(){
  if(run.mock || run.blind) return;    // 模考和「做完再出答案」模式都不当场判分
  const q = run.qs[run.i], st = run.state[run.i];
  if(q.ty==="spr"){ const inp=$("#sprin"); st.picked = inp? inp.value.trim() : st.picked; }
  if(!st.picked) return;
  saveTime(); run.t0 = Date.now();
  st.ok = q.ty==="spr" ? sprMatch(st.picked, q.an) : q.an.includes(st.picked);
  st.sub = true;
  run.frozen = true;                   // 从这一刻起到点下一题为止不计时
  st.aid = q.id + "-" + Date.now().toString(36);
  run.written.push(st.aid);
  await recordAttempt({
    aid: st.aid, qid:q.id, eid:q.eid, sec:q.sec, dom:q.dom, sk:q.sk, df:q.df, bd:q.bd, ty:q.ty,
    picked: st.picked, correct: q.an.join("|"), ok: st.ok, ms: st.ms, why: null,
    ts: Date.now(), session: run.label, sid: run.sid, review: !!run.review
  });
  // 错题自动进错题集；复习模式下按对错升降盒子
  if(run.review && reviewQ[q.id]) gradeReview(q.id, st.ok);
  else if(!st.ok) collect(q.id, null);
  await flushReview();
  drawRun();
}

function drawReview(ri, q, st){
  const v = el("div","verdict "+(st.ok?"ok":"no"));
  v.innerHTML = `<b>${st.ok?"正确":"错误"}</b>
    <span class="ans">${q.ty==="spr"? "你填 "+esc(st.picked)+" · 正确答案 "+esc(q.an.join(" 或 "))
                                     : "你选 "+esc(st.picked)+" · 正确答案 "+esc(q.an.join("/"))}</span>`;
  ri.appendChild(v);

  // Claude 拆解：官方 rationale 只讲"为什么选 B"，这里讲"考什么能力、坑在哪、你缺什么"
  {
    const holder = el("div"); ri.appendChild(holder);
    const existing = notesByQ[q.id];
    if(existing) renderNote(holder, q, existing.text, st);
    else{
      const b = el("button","askbtn", hasKey()
        ? "拆解这道题 — 考的是什么能力，你为什么会错"
        : "填入 DeepSeek API key 后可以拆解这道题（点这里去设置）");
      b.onclick = ()=> hasKey() ? explainOne(holder, q, st, b) : (closeRun(), gotoView("settings"));
      holder.appendChild(b);
    }
  }

  ri.appendChild(el("div","rat",
    `<div class="eyebrow">College Board 官方解析</div><div class="qtext">${q.ra}</div>`));

  const src = el("div","srcbox");
  src.innerHTML = `<div class="eyebrow">题目来源</div>
    <dl class="srcgrid">
      <dt>题库</dt><dd>College Board SAT Suite Educator Question Bank</dd>
      <dt>接口</dt><dd>qbank-api.collegeboard.org · asmtEventId 99 · test ${q.sec}</dd>
      <dt>Question ID</dt><dd>${esc(q.id)}</dd>
      <dt>external_id</dt><dd>${esc(q.eid)}</dd>
      <dt>分类</dt><dd>${esc(DOMAINS[q.dom].name)} → ${esc(q.sk)} · ${DIFF[q.df]||q.df} · band ${q.bd}</dd>
      <dt>抓取日期</dt><dd>${esc(PULLED_ON)}</dd>
      <dt>原页面</dt><dd><a href="https://satsuiteeducatorquestionbank.collegeboard.org/" target="_blank" rel="noopener">satsuiteeducatorquestionbank.collegeboard.org</a></dd>
    </dl>
    <div style="margin-top:9px;font-size:11px;color:var(--ink-3)">题目与解析版权归 College Board 所有，此处仅作个人备考使用。</div>`;
  ri.appendChild(src);
}

/* ============ DeepSeek ============
   浏览器直连 api.deepseek.com（已确认该接口返回 CORS 头）。
   API key 只存在访问者自己浏览器的 localStorage 里，不进仓库、不上传任何服务器。 */
/* 旧调用点（逐题拆解、薄弱点分析、试卷整理）统一走带故障转移的 aiChat */
async function dsChat(prompt, opt){
  return aiChat([{role:"user", content:prompt}], opt||{});
}
const dsErrorText = (code, msg)=> aiErrText(code, msg);

/* 把用户的长期偏好 + 最近的负面反馈，拼进每一次讲题请求 */
function prefBlock(){
  let s = "";
  if(settings.pref && settings.pref.trim()){
    s += "\n\n【我对讲题的长期要求】\n" + settings.pref.trim();
  }
  const fb = (settings.fb||[]).filter(f=>f.text && f.text.trim()).slice(-6);
  if(fb.length){
    s += "\n\n【我之前对讲解的反馈，请照着改】\n"
       + fb.map((f,i)=>`${i+1}. ${f.text.trim()}`).join("\n");
  }
  return s;
}

/* ============ 题目 → 纯文本 ============
   喂给模型的文本必须和屏幕上看到的完全一致，否则它分析的就是另一道题。
   踩过的坑（都有真实题目对应，见 tools/audit-serializer.cjs）：
   · 311 个 SVG 里 308 个带 aria-label 官方图描述，直接删 figure 会丢掉 13% 题目的图信息
   · 71 个表格全部包在 <figure> 内，删 figure 等于连表带数据一起删
   · 76 个 <math> 没有 alttext，只能线性化 MathML
   · 填空是 <span aria-hidden>______</span><span class="sr-only">blank</span>，
     不处理模型会读到一个叫 blank 的单词 */

function mathToText(el){
  const alt = el.getAttribute("alttext");
  if(alt && alt.trim()) return " " + alt.trim() + " ";
  const walk = n=>{
    if(n.nodeType===3) return n.nodeValue;
    const tag = (n.tagName||"").toLowerCase().replace(/^m:/,"");
    const kids = [...n.childNodes].map(walk);
    switch(tag){
      case "msup":   return kids[0] + "^" + kids.slice(1).join("");
      case "msub":   return kids[0] + "_" + kids.slice(1).join("");
      case "mfrac":  return "(" + kids[0] + ")/(" + kids.slice(1).join("") + ")";
      case "msqrt":  return "sqrt(" + kids.join("") + ")";
      case "mroot":  return "root" + kids[1] + "(" + kids[0] + ")";
      case "mo": case "mi": case "mn": case "mtext": return kids.join("");
      default:       return kids.join("");
    }
  };
  const t = walk(el).replace(/\s+/g," ").trim();
  return t ? " " + t + " " : " 〔公式〕 ";
}

function tableToText(tbl){
  const cap = tbl.querySelector("caption");
  const rows = [...tbl.querySelectorAll("tr")].map(tr =>
    [...tr.children].map(td => td.textContent.replace(/\s+/g," ").trim()));
  if(!rows.length) return "";
  const w = rows[0].map((_,i)=> Math.max(...rows.map(r=>(r[i]||"").length)));
  const line = r => "| " + r.map((c,i)=>(c||"").padEnd(w[i]||0)).join(" | ") + " |";
  const out = [];
  if(cap) out.push("表格：" + cap.textContent.replace(/\s+/g," ").trim());
  out.push(line(rows[0]));
  out.push("|" + w.map(n=>"-".repeat((n||0)+2)).join("|") + "|");
  rows.slice(1).forEach(r=>out.push(line(r)));
  return "\n" + out.join("\n") + "\n";
}

function htmlToPlain(html){
  if(!html) return "";
  const root = document.createElement("div");
  root.innerHTML = String(html);

  // 1) 表格先抽出来（它们都藏在 figure 里，晚一步就被连锅端了）
  root.querySelectorAll("table").forEach(t=>{
    const txt = tableToText(t);
    const holder = t.closest("figure") || t;
    holder.replaceWith(document.createTextNode(txt));
  });
  // 2) 公式
  root.querySelectorAll("math").forEach(m=> m.replaceWith(document.createTextNode(mathToText(m))));
  // 3) 图形：官方 aria-label 就是图的正式描述，必须保留
  root.querySelectorAll("svg,img").forEach(f=>{
    const d = (f.getAttribute("aria-label") || f.getAttribute("alt") || "").replace(/\s+/g," ").trim();
    const holder = f.closest("figure") || f;
    holder.replaceWith(document.createTextNode(d ? `\n〔图：${d}〕\n` : "\n〔此处有一张图，官方未提供文字描述〕\n"));
  });
  // 剩下的 figure 只是包装层（有的题嵌套四层），表格和图已经变成文本节点了。
  // 必须「拆包装」而不是删节点，否则会把刚放进去的表格文字一起删掉。
  for(let guard=0; guard<50 && root.querySelector("figure"); guard++){
    const f = root.querySelector("figure");
    while(f.firstChild) f.parentNode.insertBefore(f.firstChild, f);
    f.remove();
  }
  // 4) 填空：aria-hidden 的下划线 + sr-only 的 "blank" 是同一个空
  root.querySelectorAll(".sr-only").forEach(e=> e.remove());
  root.querySelectorAll("[aria-hidden='true']").forEach(e=>{
    if(/^[_\s]+$/.test(e.textContent)) e.replaceWith(document.createTextNode(" 〔空格〕 "));
  });
  // 5) 块级元素之间留换行，否则段落会粘成一坨
  root.querySelectorAll("p,div,li,br,tr").forEach(e=> e.appendChild(document.createTextNode("\n")));

  let t = root.textContent;
  t = t.replace(/[_]{3,}/g, " 〔空格〕 ");          // 漏网的裸下划线
  t = t.replace(/[ \t\u00a0]+/g, " ");
  t = t.replace(/ *\n */g, "\n").replace(/\n{3,}/g, "\n\n");
  return t.trim();
}

/* 一道题的完整事实包。模型看到的就是这些，不多不少。 */
function serializeQuestion(q, a, opt){
  opt = opt || {};
  const L = ["A","B","C","D"];
  const out = [];
  out.push(`【考点】${DOMAINS[q.dom].name} → ${q.sk}`);
  out.push(`【难度】${DIFF[q.df]||q.df}　【官方分数段】band ${q.bd||"—"}　【题型】${q.ty==="spr"?"填空题":"四选一"}`);
  if(q.sti) out.push(`【阅读材料】\n${htmlToPlain(q.sti)}`);
  out.push(`【问题】\n${htmlToPlain(q.ste)}`);
  if(q.ty!=="spr"){
    out.push("【选项】\n" + q.op.map((o,i)=>`${L[i]}. ${htmlToPlain(o)}`).join("\n"));
  }
  out.push(`【正确答案】${q.an.join(" 或 ")}`);
  if(a && a.picked!=null && a.picked!==""){
    out.push(`【我的作答】${a.picked}${a.ok?"（对）":"（错）"}${a.ms?`，用时 ${Math.round(a.ms/1000)} 秒`:""}`);
  }
  if(opt.rationale!==false && q.ra){
    out.push(`【College Board 官方解析（权威，不得与之冲突）】\n${htmlToPlain(q.ra)}`);
  }
  return out.join("\n\n");
}

/* 单次调用，失败会依次换下一个供应商 */
async function aiChat(messages, opt){
  opt = opt||{};
  const list = activeProviders();
  if(!list.length){ const e=new Error("no provider"); e.code="no_key"; throw e; }
  let lastErr = null;
  for(const p of list){
    try{
      return await callOne(p, messages, opt);
    }catch(e){
      lastErr = e;
      aiLastError = `[${p.name}] ${e.code||"error"}: ${e.message||""}`;
      if(e.code==="cancelled") throw e;
      if(opt.onFallback && list.indexOf(p) < list.length-1) opt.onFallback(p.name, e.code);
    }
  }
  throw lastErr || new Error("all providers failed");
}
let aiLastError = "";

async function callOne(p, messages, opt){
  const base = p.base.replace(/\/+$/,"");
  const body = {model:p.model, messages, temperature: opt.temperature==null?0.3:opt.temperature,
                stream: opt.stream!==false};
  let r;
  try{
    r = await fetch(base+"/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+p.key.trim()},
      body: JSON.stringify(body), signal: opt.signal});
  }catch(err){
    if(err && err.name==="AbortError"){ const e=new Error("已取消"); e.code="cancelled"; throw e; }
    const e=new Error("连不上 "+base); e.code="network"; throw e;
  }
  if(!r.ok){
    let d=""; try{ const j=await r.json(); d=(j.error&&(j.error.message||j.error.type))||""; }catch(_){}
    const e=new Error(d||("HTTP "+r.status));
    e.code = r.status===401?"bad_key" : r.status===402?"no_balance"
           : r.status===429?"rate_limited" : r.status===404?"bad_model" : "http_"+r.status;
    throw e;
  }
  if(!body.stream){
    const j = await r.json();
    const t = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if(!t || !t.trim()){ const e=new Error("空回复"); e.code="empty"; throw e; }
    if(opt.onText) opt.onText(t);
    return t;
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf="", out="";
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split("\n"); buf = lines.pop();
    for(const line of lines){
      const t=line.trim();
      if(!t.startsWith("data:")) continue;
      const pl=t.slice(5).trim();
      if(pl==="[DONE]") continue;
      let j; try{ j=JSON.parse(pl); }catch(_){ continue; }
      const d=j.choices && j.choices[0] && j.choices[0].delta;
      if(d && d.content){ out += d.content; if(opt.onText) opt.onText(out); }
    }
  }
  if(!out.trim()){
    // 流式解析不出东西就退回非流式再试一次，不让它成为单点故障
    return await callOne(p, messages, Object.assign({}, opt, {stream:false}));
  }
  return out;
}

function aiErrText(code, msg){
  return code==="no_key"      ? "还没配置任何模型。去「设置 → AI 模型」加一个。"
       : code==="bad_key"     ? "API key 不对或失效（401）"
       : code==="no_balance"  ? "账户余额不足（402）"
       : code==="rate_limited"? "请求太频繁（429），等几秒"
       : code==="bad_model"   ? "接口或模型名不对（404），检查 base URL 和模型 ID"
       : code==="network"     ? "连不上接口 —— 检查网络，或在设置里换一个供应商"
       : code==="cancelled"   ? "已取消"
       : code==="empty"       ? "模型没返回内容"
       : "调用失败" + (msg?"："+msg:"");
}

/* ---- 从错题本里捞相关历史（本地检索，不花 token 也不会编） ---- */
function relatedMistakes(q, limit){
  limit = limit || 5;
  const rows = attempts.filter(a=>!a.ok && a.qid!==q.id);
  const sameSkill = rows.filter(a=>a.sk===q.sk);
  const sameDomain = rows.filter(a=>a.dom===q.dom && a.sk!==q.sk);
  const pick = sameSkill.concat(sameDomain).slice(-limit).reverse();
  if(!pick.length) return "";
  const lines = pick.map(a=>{
    const qq = BYID[a.qid]; if(!qq) return "";
    const stem = htmlToPlain(qq.ste).replace(/\n/g," ").slice(0,90);
    return `· ${a.sk}（${DIFF[a.df]||a.df}，band ${a.bd}）：${stem}… 正确 ${a.correct}，我选了 ${a.picked||"未答"}`;
  }).filter(Boolean);
  const stat = {};
  rows.forEach(a=>{ stat[a.sk]=(stat[a.sk]||0)+1; });
  const top = Object.entries(stat).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(([k,v])=>`${k} ${v} 道`).join("、");
  return `【我的错题背景】\n累计错题分布：${top}\n最近同类错题：\n${lines.join("\n")}`;
}
